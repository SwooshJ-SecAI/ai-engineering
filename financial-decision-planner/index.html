    const rInc=(m.housing_payment+m.existing_debt)/(m.gross+500)*100; out.push({text:`Increase verified gross income +$500: back-end → ${fmtPct(rInc)}.`, monthly:0, mortgageEffect:`Back-end → ${fmtPct(rInc)}`, first:'Document additional income.', gain:m.back-rInc});
    // extend timeline / preserve reserves
    out.push({text:`Extend timeline to save more: each ${fmtMoney(500)}/mo for 12 mo adds ${fmtMoney(6000)} reserves/down payment.`, monthly:500, mortgageEffect:'Higher post-closing reserves', first:'Push purchase date out in Settings.', gain:0.1});
    return out.sort((a,b)=>(b.gain||0)-(a.gain||0));
  },

  /* ---- Conditional rules (returns list of {level,text}) ---- */
  conditions(db,r){
    const a=db.settings.assumptions, out=[], mx=r.metrics;
    if(mx.fcf<0) out.push({level:'red',text:'Projected cash flow < 0 → cash-flow stabilization prioritized above all optional actions.'});
    if(mx.em<a.reserve_target_months) out.push({level:'amber',text:`Emergency reserves (${mx.em.toFixed(1)} mo) below target (${a.reserve_target_months}) → recommendations that consume liquid savings are restricted.`});
    const hiapr=Calc.byType(db,'debt').find(c=>(+c.apr)>a.credit_apr_threshold);
    if(hiapr && mx.liquid>=a.min_cash_reserve && mx.em>=1) out.push({level:'blue',text:`${hiapr.name} APR ${(+hiapr.apr).toFixed(1)}% > threshold ${a.credit_apr_threshold}% and reserves protected → accelerated payoff evaluated.`});
    const streak=this.consecutiveOver(db); if(streak.count>=3) out.push({level:'amber',text:`${streak.cat.name} over budget ${streak.count} periods → classify as behavioral, structural, seasonal, or unrealistic budget.`});
    if(this.monthsTo(addMonths(a.purchase_within_months))<=12) out.push({level:'blue',text:'Mortgage purchase within 12 months → liquidity, DTI, payment history, and closing reserves prioritized.'});
    if(a.variable_income) out.push({level:'amber',text:'Variable income flagged → conservative income and expense assumptions applied.'});
    const unrec=db.reconcile.filter(x=>x.decision==='pending'); if(unrec.length) out.push({level:'amber',text:`${unrec.length} account item(s) not reconciled → recommendations relying materially on them are suppressed.`});
    const lowOCR=db.documents.some(d=>d.fields.some(f=>f.confidence<0.7 && !f.verified)); if(lowOCR) out.push({level:'red',text:'OCR confidence below threshold on unverified fields → manual validation required before use.'});
    // promo APR expiry — synthetic none, keep rule visible
    // goal conflict: two High goals both underfunded
    const highUnder=db.goals.filter(g=>{const gc=Calc.goalCompute(db,g);return g.priority==='High'&&gc.gap>0;});
    if(highUnder.length>=2 && mx.fcf < highUnder.reduce((s,g)=>s+Calc.goalCompute(db,g).gap,0)) out.push({level:'amber',text:`Goals conflict: ${highUnder.map(g=>g.name).join(' & ')} both underfunded and cash flow can't cover both → a priority decision is requested.`});
    return out;
  },

  /* ---- Plan bundles ---- */
  bundles(db,r){
    const mx=r.metrics; const surplus=Math.max(0,mx.fcf);
    const debts=Calc.byType(db,'debt').slice().sort((x,y)=>(+y.apr)-(+x.apr));
    const topDebt=debts[0];
    const efGap=Math.max(0, mx.ess*mx.targetM - mx.liquid);
    const goalGap=db.goals.reduce((s,g)=>s+Math.max(0,Calc.goalCompute(db,g).gap),0);
    const mk=(name,alloc,risks,behavior,note)=>({name,alloc,risks,behavior,note,
      weekly:alloc.reduce((s,x)=>s+x.amt,0)*12/52, monthly:alloc.reduce((s,x)=>s+x.amt,0)});
    const stability=mk('Stability',
      [{k:'Essentials + minimums (protected)',amt:0},{k:'Emergency fund',amt:Math.min(surplus,efGap/mx.targetM||surplus)},{k:'Hold discretionary flat',amt:0}],
      'Slowest debt/goal progress.', 'Freeze discretionary increases; automate reserve transfer.',
      'Prioritizes positive cash flow, minimum payments, and reserves before anything optional.');
    const balAlloc=[]; let rem=surplus;
    const efPart=Math.min(rem, (efGap/mx.targetM)||0); balAlloc.push({k:'Emergency fund',amt:efPart}); rem-=efPart;
    const debtPart=Math.min(rem, topDebt?rem*0.6:0); if(topDebt) balAlloc.push({k:'Extra to '+topDebt.name,amt:debtPart}); rem-=debtPart;
    balAlloc.push({k:'Goals',amt:Math.max(0,rem)});
    const balanced=mk('Balanced', balAlloc, 'Moderate progress on all fronts.', 'Maintain current lifestyle; small discretionary trims.',
      'Splits surplus across reserves, debt reduction, and goal funding.');
    const accAlloc=[]; let rem2=surplus + mx.disc*0.3; // pull 30% discretionary
    const efA=Math.min(rem2,(efGap/Math.max(1,mx.targetM))||0); accAlloc.push({k:'Emergency (fast)',amt:efA}); rem2-=efA;
    if(topDebt){ const dA=Math.min(rem2, rem2*0.8); accAlloc.push({k:'Aggressive '+topDebt.name,amt:dA}); rem2-=dA; }
    accAlloc.push({k:'Goals (stretch)',amt:Math.max(0,rem2)});
    const accelerated=mk('Accelerated', accAlloc, 'High execution pressure; thin lifestyle slack.', 'Cut ~30% discretionary; strict tracking.',
      'Maximizes payoff/goal speed by reducing discretionary spending.');
    return {stability,balanced,accelerated};
  }
};

</script>
<script>
/* ===== reco_ui.js (inlined) ===== */
/* ============================================================
   RECOMMENDATION CENTER — view + interactions (extension)
   Appended after reco.js. Registers Views.recommendations and
   Views._after_recommendations without altering existing views.
   ============================================================ */
'use strict';

/* live result cache for the current session view */
App.recoResult = null;
App.recoView = 'cards';   // cards | report | plans | history

Views.recommendations = function(){
  const db=Store.db;
  const dq=DataQuality.score(db);
  const dqBadge = dq.score>=90?'green':dq.score>=75?'blue':dq.score>=60?'amber':'red';
  const r=App.recoResult;
  const tabs=(id,lbl)=>`<button class="${App.recoView===id?'active':''}" onclick="App.recoView='${id}';App.render()">${lbl}</button>`;
  return `
  ${syntheticNote}
  <div class="banner info"><span class="b-badge" style="background:#0d2440;color:var(--accent);border-color:var(--accent2)">Advisory</span>
    Recommendations are quantitative planning guidance from your stored data — not guaranteed lending, tax, legal, or investment advice. Nothing here changes a verified record or the baseline until you approve it.</div>

  <div class="section">
    <div class="section-head">
      <div><h3>Recommendation Center</h3><div class="desc">Prioritized action plan regenerated on each financial review</div></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="badge ${dqBadge}" title="Data-quality gate">Data quality ${dq.score.toFixed(0)} \u00b7 ${dq.band}</span>
        <button class="btn" onclick="RecoUI.run()">Run Financial Review</button>
      </div>
    </div>
    <div class="stat-inline" style="margin-top:6px">
      <div class="si"><div class="n">${fmtMoney(Calc.monthlySurplus(db))}</div><div class="l">Free cash flow</div></div>
      <div class="si"><div class="n">${RecoData.essentialExpenses(db)?(RecoData.liquidEmergency(db)/RecoData.essentialExpenses(db)).toFixed(1):'0'}</div><div class="l">Emergency months (essentials)</div></div>
      <div class="si"><div class="n">${fmtPct(Calc.dti(db))}</div><div class="l">Debt-to-income</div></div>
      <div class="si"><div class="n">${db.reco_runs.length}</div><div class="l">Saved runs</div></div>
    </div>
  </div>

  ${!r ? `<div class="section"><div class="empty">No review yet this session. Click <strong>Run Financial Review</strong> to generate a prioritized action plan from your current data.${db.reco_runs.length?' Your last saved run is available under History.':''}</div>
    <div class="pill-tabs" style="margin-top:8px">${tabs('history','History')}</div>
    ${App.recoView==='history'?RecoUI.historyHtml():''}</div>`
  : `
  <div class="pill-tabs" style="margin-bottom:14px">
    ${tabs('cards','Action cards')} ${tabs('report','Budget-run report')} ${tabs('plans','Plan bundles')} ${tabs('history','History')}
  </div>
  ${App.recoView==='cards'?RecoUI.cardsHtml(r):''}
  ${App.recoView==='report'?RecoUI.reportHtml(r):''}
  ${App.recoView==='plans'?RecoUI.plansHtml(r):''}
  ${App.recoView==='history'?RecoUI.historyHtml():''}
  `}`;
};
Views._after_recommendations=function(){ /* charts if any later */ };

const RecoUI = {
  run(){
    const db=Store.db;
    const r=Reco.build(db);
    App.recoResult=r; App.recoView='cards';
    // persist a versioned run
    const prev=db.reco_runs[db.reco_runs.length-1]||null;
    const runRec={ id:uid('run'), at:nowISO(), user_id:USER_ID,
      metrics:r.metrics, dq:{score:r.dq.score,band:r.dq.band},
      recos:r.primary.map(x=>({key:x.key,action:x.action,score:x.score,class:x.class,monthly:x.monthly,annual:x.annual,provisional:x.provisional})),
      conditions:Reco.conditions(db,r).length };
    db.reco_runs.push(runRec);
    if(db.reco_runs.length>60) db.reco_runs.shift();
    Store.log('review','Ran financial review — '+r.primary.length+' recommendations, DQ '+r.dq.score.toFixed(0));
    Store.save();
    App._prevRun=prev;
    toast('Financial review complete','green'); App.render();
  },

  statusOf(key){ return (Store.db.reco_status[key]||{}).status||'new'; },
  setStatus(key,status,reason){
    Store.db.reco_status[key]={status,reason:reason||null,at:nowISO()};
    Store.log('recommendation', key+' → '+status+(reason?(' ('+reason+')'):''));
    Store.save(); App.render();
  },
  act(key,status){
    if(status==='dismissed'){ const reason=prompt('Reason for dismissing this recommendation (recorded in audit):',''); if(reason===null) return; this.setStatus(key,'dismissed',reason); toast('Recommendation dismissed','amber'); return; }
    this.setStatus(key,status); toast('Marked '+status,'green');
  },

  cardsHtml(r){
    if(!r.primary.length) return '<div class="section"><div class="empty">No action needed — cash flow, reserves, debt, goals, and mortgage readiness are within thresholds on current data.</div></div>';
    const cond=Reco.conditions(Store.db,r);
    const condHtml = cond.length? `<div class="section"><h3>Conditions requiring attention</h3><div class="desc">Rule-based gates applied to this run</div>${cond.map(c=>`<div class="kv"><span class="k">${badge(c.level)} ${c.text}</span><span class="v"></span></div>`).join('')}</div>`:'';
    const cards=r.primary.map((x,i)=>this.card(x,i+1)).join('');
    const awaiting=r.dq.gaps.length? `<div class="section"><h3>Items awaiting verification</h3>${r.dq.gaps.map(g=>`<div class="kv"><span class="k">${badge('amber')} ${g}</span><span class="v"></span></div>`).join('')}</div>`:'';
    return condHtml+cards+awaiting;
  },

  card(x,rank){
    const st=this.statusOf(x.key);
    const stBadge={new:'gray',accepted:'green',deferred:'amber',dismissed:'red',completed:'blue'}[st]||'gray';
    const eff=(lbl,v)=>`<div class="kv"><span class="k">${lbl}</span><span class="v">${v}</span></div>`;
    const money=(n)=> n===0?'\u2014':(n>0?'+':'')+fmtMoney2(Math.abs(n)*(n<0?-1:1)).replace('$-','-$');
    return `<div class="section" style="border-left:3px solid var(--${classBadge(x.score)}-bd,var(--border))">
      <div class="section-head">
        <div>
          <h3>#${rank} \u00b7 ${x.action} ${badge(classBadge(x.score),x.class)} ${x.provisional?badge('amber','Provisional \u2014 verify source data'):''}</h3>
          <div class="desc">${x.area} \u00b7 score ${x.score}/100 \u00b7 confidence ${x.confidenceLabel} (${x.dims.confidence}) \u00b7 status ${badge(stBadge,st)}</div>
        </div>
        <div style="text-align:right;min-width:120px">
          <div class="mini">Priority score</div>
          <div style="font-family:var(--mono);font-size:22px;font-weight:600;color:var(--${classBadge(x.score)},var(--text))">${x.score}</div>
        </div>
      </div>
      <div class="two-col">
        <div>
          ${eff('Why it matters',x.why)}
          ${eff('Current state',x.current)}
          ${eff('Proposed adjustment',x.proposed)}
          ${eff('Next step',x.firstAction)}
          ${eff('Review date',fmtDate(x.reviewDate))}
        </div>
        <div>
          ${eff('Monthly effect',money(x.monthly))}
          ${eff('Annual effect',money(x.annual))}
          ${eff('Goal effect',x.goalEffect)}
          ${eff('Debt / interest effect',x.debtEffect)}
          ${eff('Mortgage-readiness effect',x.mortgageEffect)}
          ${eff('Risk / tradeoff',x.risk)}
          ${eff('Data used',x.dataUsed.join(', '))}
        </div>
      </div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn ghost sm" onclick="RecoUI.why('${x.key}')">Why this recommendation?</button>
        <button class="btn ghost sm" onclick="RecoUI.whatIf('${x.key}')">What if I accept this?</button>
        <button class="btn ghost sm" onclick="App.go('scenario')">Compare with baseline</button>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="RecoUI.act('${x.key}','accepted')">Accept</button>
        <button class="btn sec sm" onclick="RecoUI.act('${x.key}','deferred')">Defer</button>
        <button class="btn sec sm" onclick="RecoUI.act('${x.key}','completed')">Complete</button>
        <button class="btn danger sm" onclick="RecoUI.act('${x.key}','dismissed')">Dismiss</button>
      </div>
    </div>`;
  },

  why(key){
    const r=App.recoResult; const x=r.all.find(z=>z.key===key); if(!x) return;
    const a=Store.db.settings.assumptions;
    const body=`
      <div class="mini" style="margin-bottom:6px">FORMULA & INPUTS</div>
      <div class="calc" style="font-family:var(--mono);font-size:11.5px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:10px;white-space:pre-wrap;color:var(--text2)">${x.calc.join('\n')}</div>
      <div class="kv"><span class="k">Data sources</span><span class="v">${x.dataUsed.join(', ')}</span></div>
      <div class="kv"><span class="k">Key assumptions</span><span class="v">return ${(a.default_return*100).toFixed(1)}%, inflation ${(a.inflation*100).toFixed(1)}%, reserve target ${a.reserve_target_months} mo${a.tax_rate!=null?(', tax '+(a.tax_rate*100).toFixed(0)+'%'):', tax rate: not assumed'}</span></div>
      <div class="kv"><span class="k">Most sensitive assumption</span><span class="v">${this.sensitiveNote(x)}</span></div>
      <div class="kv"><span class="k">Confidence limitation</span><span class="v">${x.provisional?'Below 60 — provisional; verify source data before acting definitively.':'Confidence '+x.dims.confidence+' — acceptable for planning.'}</span></div>
      <div class="kv"><span class="k">What would invalidate this</span><span class="v">${this.invalidator(x)}</span></div>
      <div class="kv"><span class="k">If you do nothing</span><span class="v">${this.doNothing(x)}</span></div>`;
    modal('Why this recommendation? \u2014 '+x.action, body, null, []);
  },
  sensitiveNote(x){
    if(/debt/i.test(x.area)) return 'APR and extra-payment amount drive interest saved.';
    if(/emergency/i.test(x.area)) return 'Reserve-target months changes the required contribution proportionally.';
    if(/mortgage/i.test(x.area)) return 'Interest rate and existing debt move DTI the most.';
    if(/goal/i.test(x.area)) return 'Target date and expected return dominate the required monthly figure.';
    if(/cash/i.test(x.area)) return 'The tax rate (if used) changes the gross-income requirement.';
    return 'Income and essential-expense estimates.';
  },
  invalidator(x){
    if(/debt/i.test(x.area)) return 'A lower verified APR, a prepayment penalty, or reserves dropping below the floor.';
    if(/mortgage/i.test(x.area)) return 'Updated rate quote, changed home price, or verified income change.';
    if(/goal/i.test(x.area)) return 'A change to target amount, date, or contribution capacity.';
    if(/cash/i.test(x.area)) return 'Corrected income or a reclassified one-time expense.';
    return 'Any correction to the underlying records or assumptions.';
  },
  doNothing(x){
    if(/cash/i.test(x.area)) return 'The monthly deficit continues to erode reserves.';
    if(/emergency/i.test(x.area)) return 'You remain exposed to a shock with limited buffer.';
    if(/debt/i.test(x.area)) return 'Interest keeps accruing at the current APR.';
    if(/mortgage/i.test(x.area)) return 'Qualification and post-closing safety stay below guides.';
    if(/goal/i.test(x.area)) return 'The goal misses its target date at the current pace.';
    return 'The condition persists into the next review.';
  },

  whatIf(key){
    const db=Store.db, r=App.recoResult; const x=r.all.find(z=>z.key===key); if(!x) return;
    const base=Calc.baseline(db);
    // Approximate accepted-state deltas (does NOT mutate baseline)
    let deltaCash=0, note='';
    if(/cash|essential/i.test(x.area)){ deltaCash=Math.abs(x.monthly); note='Applying the adjustment restores/adds this to monthly cash flow.'; }
    else if(/debt/i.test(x.area)){ deltaCash=x.monthly; note='Extra payment reduces monthly free cash now, but releases the payment and saves interest after payoff.'; }
    else if(/emergency|goal|recurring/i.test(x.area)){ deltaCash=/recurring/i.test(x.area)?Math.abs(x.monthly):-Math.abs(x.monthly); note=/recurring/i.test(x.area)?'Cancelling frees this monthly.':'Directing this to the target reduces free cash now.'; }
    const projected=base.surplus+deltaCash;
    const body=`
      <div class="kv"><span class="k">Recommendation</span><span class="v">${x.action}</span></div>
      <div class="kv"><span class="k">Baseline free cash flow</span><span class="v">${fmtMoney(base.surplus)}/mo</span></div>
      <div class="kv"><span class="k">Estimated after accepting</span><span class="v" style="color:${projected>=base.surplus?'var(--green)':'var(--amber)'}">${fmtMoney(projected)}/mo</span></div>
      <div class="kv"><span class="k">Annualized effect</span><span class="v">${fmtMoney(Math.abs(x.annual))}/yr</span></div>
      <div class="mini" style="margin-top:8px">${note} This is a projection only; the immutable baseline is unchanged. Use Scenario Lab to model it in full, then approve there if you want to adopt it.</div>`;
    modal('What if I accept this? \u2014 '+x.action, body, ()=>{ App.go('scenario'); }, [{label:'Open in Scenario Lab',cls:'sec',fn:()=>{closeModal();App.go('scenario');}}]);
  },

  reportHtml(r){
    const db=Store.db, mx=r.metrics; const prev=App._prevRun;
    const cmp=(cur,prevVal,fmt,better)=>{ if(prevVal===undefined||prevVal===null) return '<span class="mini">no prior</span>'; const d=cur-prevVal; const good=better==='up'?d>=0:d<=0; return `<span style="color:${d===0?'var(--muted)':good?'var(--green)':'var(--red)'}">${d>0?'+':''}${fmt(d)}</span>`; };
    const rows=this.trendRows(db);
    return `
    <div class="section"><h3>1 \u00b7 Executive summary</h3>
      <p style="font-size:13px;color:var(--text2)">This run produced <strong>${r.primary.length}</strong> ranked recommendation(s). Free cash flow is <strong>${fmtMoney(mx.fcf)}/mo</strong>, essential coverage <strong>${mx.ecr.toFixed(2)}</strong>, emergency reserves <strong>${mx.em.toFixed(1)} months</strong> (${mx.band}), and data quality <strong>${r.dq.score.toFixed(0)} (${r.dq.band})</strong>. ${mx.fcf<0?'Cash-flow stabilization is the top priority.':r.dq.score<60?'Definitive major-decision advice is withheld until data quality reaches 60.':'Position is stable enough to pursue prioritized improvements.'}</p>
    </div>
    <div class="section"><h3>2 \u00b7 Changes since previous run</h3>
      ${prev? `<div class="kv"><span class="k">Free cash flow</span><span class="v">${fmtMoney(mx.fcf)} &nbsp; ${cmp(mx.fcf,prev.metrics.fcf,fmtMoney,'up')}</span></div>
      <div class="kv"><span class="k">Emergency months</span><span class="v">${mx.em.toFixed(1)} &nbsp; ${cmp(mx.em,prev.metrics.em,(v)=>v.toFixed(1),'up')}</span></div>
      <div class="kv"><span class="k">Data quality</span><span class="v">${r.dq.score.toFixed(0)} &nbsp; ${cmp(r.dq.score,prev.dq.score,(v)=>v.toFixed(0),'up')}</span></div>`
      : '<div class="empty">No previous run this session to compare against.</div>'}
    </div>
    <div class="section"><h3>3 \u00b7 Budget vs actual variance</h3>
      <div class="desc">Current month top movements (see Transactions for the full table)</div>
      ${Calc.topUnfavorable(db,App.varMonth,3).map(v=>`<div class="kv"><span class="k">${v.category} ${badge(v.status)}</span><span class="v">+${fmtMoney(v.variance_amount)} (${fmtPct(v.variance_percentage)})</span></div>`).join('')||'<div class="mini">No unfavorable variance.</div>'}
    </div>
    <div class="section"><h3>4\u20138 \u00b7 Updated trajectories</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Metric</th><th class="num">Now</th><th class="num">Prev month</th><th class="num">3-mo avg</th><th class="num">6-mo avg</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="mini" style="margin-top:8px">A single one-time expense is not treated as a trend unless it persists across periods.</div>
    </div>
    <div class="section"><h3>9 \u00b7 Top five ranked recommendations</h3>
      ${r.primary.map((x,i)=>`<div class="kv"><span class="k">#${i+1} ${badge(classBadge(x.score),x.score+'')} ${x.action}${x.provisional?' '+badge('amber','provisional'):''}</span><span class="v">${x.monthly?((x.monthly>0?'+':'')+fmtMoney(x.monthly)+'/mo'):''}</span></div>`).join('')}
    </div>
    <div class="section"><h3>10 \u00b7 Conditions requiring attention</h3>
      ${Reco.conditions(db,r).map(c=>`<div class="kv"><span class="k">${badge(c.level)} ${c.text}</span><span class="v"></span></div>`).join('')||'<div class="mini">None.</div>'}
    </div>
    <div class="section"><h3>11 \u00b7 Items awaiting verification</h3>
      ${r.dq.gaps.map(g=>`<div class="kv"><span class="k">${badge('amber')} ${g}</span><span class="v"></span></div>`).join('')||'<div class="mini">None.</div>'}
    </div>
    <div class="section"><h3>12 \u00b7 Recommended actions before next run</h3>
      ${r.primary.slice(0,3).map(x=>`<div class="kv"><span class="k">${x.firstAction}</span><span class="v">by ${fmtDate(x.reviewDate)}</span></div>`).join('')}
    </div>`;
  },
  trendRows(db){
    const months=Object.keys(db.actuals).sort();
    const cm=months[months.length-1], pm=months[months.length-2];
    const spendCats=Calc.byType(db,'fixed').concat(Calc.byType(db,'variable'));
    const spendFor=(ym)=>spendCats.reduce((s,c)=>s+(+(db.actuals[ym]||{})[c.id]||0),0);
    const avg=(n)=>{ const sel=months.slice(-n); return sel.length? sel.reduce((s,m)=>s+spendFor(m),0)/sel.length : 0; };
    const row=(lbl,now,prev,a3,a6,fmt)=>`<tr><td>${lbl}</td><td class="num">${fmt(now)}</td><td class="num">${prev!=null?fmt(prev):'\u2014'}</td><td class="num">${fmt(a3)}</td><td class="num">${fmt(a6)}</td></tr>`;
    return [
      row('Actual spend',spendFor(cm), pm?spendFor(pm):null, avg(3), avg(6), fmtMoney),
      row('Free cash flow',Calc.monthlySurplus(db), null, Calc.monthlySurplus(db), Calc.monthlySurplus(db), fmtMoney),
      row('Emergency months', RecoData.essentialExpenses(db)?RecoData.liquidEmergency(db)/RecoData.essentialExpenses(db):0, null, 0,0,(v)=>v.toFixed(1)),
      row('Debt-to-income', Calc.dti(db), null, Calc.dti(db), Calc.dti(db), (v)=>fmtPct(v))
    ].join('');
  },

  plansHtml(r){
    const db=Store.db; const b=Reco.bundles(db,r); const sel=db.reco_plan;
    const card=(p,key,desc)=>{
      const active=sel===key;
      return `<div class="section" style="${active?'border-color:var(--accent)':''}">
        <div class="section-head"><div><h3>${p.name} plan ${active?badge('blue','Selected'):''}</h3><div class="desc">${desc}</div></div>
        <button class="btn ${active?'':'sec'} sm" onclick="RecoUI.selectPlan('${key}')">${active?'Selected':'Select plan'}</button></div>
        <div class="kv"><span class="k">Monthly allocation</span><span class="v">${fmtMoney(p.monthly)}</span></div>
        <div class="kv"><span class="k">Weekly equivalent</span><span class="v">${fmtMoney2(p.weekly)}</span></div>
        ${p.alloc.map(a=>`<div class="kv"><span class="k" style="padding-left:10px">\u2022 ${a.k}</span><span class="v">${fmtMoney(a.amt)}</span></div>`).join('')}
        <hr class="sep">
        <div class="kv"><span class="k">12-month outcome</span><span class="v">${fmtMoney(p.monthly*12)} directed</span></div>
        <div class="kv"><span class="k">Main risks</span><span class="v">${p.risks}</span></div>
        <div class="kv"><span class="k">Required behavior</span><span class="v">${p.behavior}</span></div>
      </div>`;
    };
    return `<div class="banner"><span class="b-badge">Note</span> The most aggressive plan is not labelled “best.” Choose the plan that matches your risk tolerance and execution capacity.</div>
      ${card(b.stability,'stability',b.stability.note)}
      ${card(b.balanced,'balanced',b.balanced.note)}
      ${card(b.accelerated,'accelerated',b.accelerated.note)}`;
  },
  selectPlan(k){ Store.db.reco_plan=k; Store.log('plan','Selected '+k+' plan'); Store.save(); toast(k.charAt(0).toUpperCase()+k.slice(1)+' plan selected','green'); App.render(); },

  historyHtml(){
    const runs=Store.db.reco_runs.slice().reverse();
    if(!runs.length) return '<div class="section"><div class="empty">No saved runs yet.</div></div>';
    return `<div class="section"><h3>Recommendation history</h3><div class="desc">Versioned record of finalized reviews (${runs.length})</div>
      <div class="tbl-wrap"><table><thead><tr><th>When</th><th class="num">Free cash flow</th><th class="num">Emerg. mo</th><th class="num">Data quality</th><th class="num">Recos</th><th>Top action</th></tr></thead>
      <tbody>${runs.map(x=>`<tr><td>${new Date(x.at).toLocaleString()}</td><td class="num">${fmtMoney(x.metrics.fcf)}</td><td class="num">${x.metrics.em.toFixed(1)}</td><td class="num">${x.dq.score.toFixed(0)}</td><td class="num">${x.recos.length}</td><td>${x.recos[0]?x.recos[0].action:'\u2014'}</td></tr>`).join('')}</tbody></table></div>
    </div>`;
  }
};

/* ---- Assistant grounding extension: answer explainability questions from the last run ---- */
(function extendAssistant(){
  if(typeof Assistant==='undefined') return;
  const baseAnswer=Assistant.answer.bind(Assistant);
  Assistant.answer=function(q){
    const s=q.toLowerCase();
    const r=App.recoResult;
    if(/(recommend|action plan|what should i do|priorit|highest impact|top move)/.test(s)){
      if(!r) return "Run a Financial Review in the Recommendation Center first — I answer these from the generated, data-traceable plan rather than guessing.";
      const top=r.primary[0];
      if(!top) return "The last review found no action needed — cash flow, reserves, debt, goals, and mortgage readiness were within thresholds.";
      const V="<span class='tag v'>verified</span>", E="<span class='tag e'>estimate</span>";
      return `${top.provisional?E:V} Highest priority (score ${top.score}/100): <b>${top.action}</b>.<div class='calc'>${top.calc.join('\n')}</div>Why it's first: ${top.why} Next step: ${top.firstAction}${top.provisional?" <b>Provisional — verify source data first.</b>":""}`;
    }
    if(/(data quality|verify|verified|confidence|data gate)/.test(s)){
      const dq=DataQuality.score(Store.db);
      return `<span class='tag v'>verified</span> Data-quality score is <b>${dq.score.toFixed(0)} (${dq.band})</b>.<div class='calc'>data_quality = completeness×0.35 + verification×0.30 + recency×0.20 + reconciliation×0.15\n= ${dq.completeness.toFixed(0)}×.35 + ${dq.verification.toFixed(0)}×.30 + ${dq.recency.toFixed(0)}×.20 + ${dq.reconciliation.toFixed(0)}×.15 = ${dq.score.toFixed(0)}</div>${dq.sufficientForMajor?'Sufficient for major decisions.':'Below 60 — definitive mortgage/consolidation/forecast advice is withheld until you: '+dq.gaps.join(' ')}`;
    }
    if(/(what changed|since last|previous run)/.test(s)){
      const runs=Store.db.reco_runs; if(runs.length<2) return "I need at least two saved reviews to compare. Run another Financial Review after your next change.";
      const cur=runs[runs.length-1], prev=runs[runs.length-2];
      return `<span class='tag v'>verified</span> Since the previous run: free cash flow ${fmtMoney(prev.metrics.fcf)} → <b>${fmtMoney(cur.metrics.fcf)}</b>, emergency months ${prev.metrics.em.toFixed(1)} → <b>${cur.metrics.em.toFixed(1)}</b>, data quality ${prev.dq.score.toFixed(0)} → <b>${cur.dq.score.toFixed(0)}</b>.`;
    }
    return baseAnswer(q);
  };
  // add a suggestion chip
  const oldSuggest=Assistant.suggest.bind(Assistant);
  Assistant.suggest=function(){ oldSuggest();
    const el=document.getElementById('asstSuggest'); if(el && !/highest-impact recommendation/.test(el.innerHTML)){ const b=document.createElement('button'); b.textContent='Explain my top recommendation'; b.onclick=()=>Assistant.ask('What is my highest-impact recommendation?'); el.appendChild(b); }
  };
})();

</script>
<script>
/* ===== simple.js (inlined) ===== */
/* ============================================================
   SIMPLE MODE + ENHANCED RECOMMENDATIONS  (extension module)
   Appended last. Adds a plain-language Home view, a Simple/Advanced
   toggle, and four new reasoning layers on top of the existing engine:
   one-number guidance, effort ranking, dollarized do-nothing cost,
   and milestone framing. Removes nothing; every existing view,
   formula, and control is preserved.
   ============================================================ */
'use strict';

/* ---------- mode state ---------- */
App.mode = (function(){ try{ return localStorage.getItem('fdp::mode')||'simple'; }catch(e){ return 'simple'; } })();
/* ---- Simple Mode configurable thresholds (math unchanged; only when colors/verdict flip) ---- */
(function initSimpleThresholds(){
  const s=Store.db.settings;
  if(!s.simple){
    s.simple={ margin_thin_pct:5, reserve_stable_months:3, reserve_min_months:1, coverage_floor:1.0 };
    Store.save();
  }
})();
function ST(){ return Store.db.settings.simple; }
function setMode(m){ App.mode=m; try{ localStorage.setItem('fdp::mode',m); }catch(e){}
  RecoUI2.reshapeNav();
  App.go(m==='simple'?'home':(App.cur==='home'?'overview':App.cur));
}

/* ---------- plain-language label map (same math, human words) ---------- */
const PLAIN = {
  'Free cash flow':'Money left over each month',
  'Total monthly expenses':'What you spend each month',
  'Net monthly income':'Money coming in',
  'Savings rate':'Share of income you save',
  'Emergency-fund months':'Months you could cover with no income',
  'Total debt':'Everything you owe',
  'Debt-to-income':'Share of income going to debt',
  'Net worth':'What you own minus what you owe',
  'Budget utilization':'How much of your budget you used'
};

/* ============================================================
   ENHANCEMENT LAYER — enrich each recommendation
   ============================================================ */
const Enhance = {
  // effort: 0 (trivial) .. 100 (hard). Derived from feasibility + action nature.
  effort(x){
    let e = 100 - x.dims.feasibility;                 // low feasibility => more effort
    if(/subscription|recurring|cancel/i.test(x.action)) e = Math.min(e, 15);   // one click
    if(/autopay|automate|move \$|reduce .* by/i.test(x.firstAction||'')) e = Math.min(e, 30);
    if(/income|negotiate|refinanc|renegotiat/i.test(x.action)) e = Math.max(e, 65); // slow/external
    if(/verify|reconcile|approve/i.test(x.action)) e = Math.min(e, 25);
    return Math.max(5, Math.min(100, Math.round(e)));
  },
  effortLabel(e){ return e<=25?'Easy':e<=55?'Moderate':'Takes effort'; },

  // dollarized monthly cost of doing nothing
  doNothingCost(db,x){
    const a=db.settings.assumptions;
    if(/high-interest debt|debt-highapr/i.test(x.area+ x.key)){
      // interest accruing this month on the targeted balance
      const d=Calc.byType(db,'debt').find(c=>x.key.includes(c.id)) || Calc.byType(db,'debt').slice().sort((p,q)=>(+q.apr)-(+p.apr))[0];
      if(d) return {amt:(+d.balance)*(+d.apr)/100/12, note:`~${fmtMoney2((+d.balance)*(+d.apr)/100/12)} in interest accrues this month on ${d.name}.`};
    }
    if(/cash-flow|essential/i.test(x.area)) return {amt:Math.abs(x.monthly), note:`The ${fmtMoney(Math.abs(x.monthly))} monthly shortfall keeps draining savings.`};
    if(/emergency/i.test(x.area)) return {amt:0, note:`You stay exposed — one surprise could force high-interest borrowing.`};
    if(/recurring/i.test(x.area)) return {amt:Math.abs(x.monthly), note:`You keep paying ${fmtMoney2(Math.abs(x.monthly))}/mo for services you may not use.`};
    if(/goal/i.test(x.area)) return {amt:0, note:`The goal slips past its target date at today's pace.`};
    if(/mortgage/i.test(x.area)) return {amt:0, note:`Home qualification and safety margin stay below guide.`};
    return {amt:0, note:`The issue carries into next month unchanged.`};
  },

  // milestone framing — a felt target instead of a ratio
  milestone(db,x){
    const ess=RecoData.essentialExpenses(db), liquid=RecoData.liquidEmergency(db);
    if(/emergency/i.test(x.area)){
      const oneMonth=ess; const toNext=Math.max(0, oneMonth*Math.ceil(liquid/oneMonth+0.0001) - liquid);
      const fcf=Calc.monthlySurplus(db);
      const weeks = fcf>0? Math.ceil(toNext/ (fcf/4.33)) : null;
      return `You're ${fmtMoney(toNext)} from your next full month of safety${weeks?` — about ${weeks} weeks at your current pace`:''}.`;
    }
    if(/debt-highapr|high-interest/i.test(x.area+x.key)){
      const d=Calc.byType(db,'debt').find(c=>x.key.includes(c.id)) || Calc.byType(db,'debt').slice().sort((p,q)=>(+q.apr)-(+p.apr))[0];
      if(d) return `Clearing ${d.name} frees ${fmtMoney(d.minimum||d.budgeted)}/mo you can then send anywhere.`;
    }
    if(/goal/i.test(x.area)){
      const g=db.goals.find(gg=>x.key.includes(gg.id));
      if(g){ const gc=Calc.goalCompute(db,g); return `${gc.progress.toFixed(0)}% of the way to “${g.name}.” Next milestone: ${fmtMoney(g.current+ (g.target-g.current)*0.25)}.`; }
    }
    return null;
  },

  // the single plain instruction — one number, one move
  oneNumber(db,x){
    if(/cash-flow|essential/i.test(x.area)){
      const cut=RecoData.reducibleCats(db)[0];
      if(cut) return `Move ${fmtMoney(Math.min(Math.abs(x.monthly),(+cut.budgeted)*0.5))} out of ${cut.name} to close your shortfall.`;
      return `Free up ${fmtMoney(Math.abs(x.monthly))} this month to get back to positive.`;
    }
    if(/high-interest debt|debt-highapr/i.test(x.area+x.key)){
      const extra=Math.max(0, Math.round(-x.monthly));
      const d=Calc.byType(db,'debt').find(c=>x.key.includes(c.id)) || Calc.byType(db,'debt').slice().sort((p,q)=>(+q.apr)-(+p.apr))[0];
      if(d && extra>0) return `Put an extra ${fmtMoney(extra)} on ${d.name} this month — it's your highest-return move.`;
      if(d) return `Keep paying ${d.name}'s minimum until your reserve is rebuilt, then attack it.`;
    }
    if(/emergency/i.test(x.area)) return `Auto-transfer ${fmtMoney(Math.abs(x.monthly))} to savings on payday.`;
    if(/recurring/i.test(x.area)) return `Cancel one unused subscription to recover ${fmtMoney2(Math.abs(x.monthly))}/mo.`;
    if(/goal/i.test(x.area)) return `Add ${fmtMoney(Math.abs(x.monthly))}/mo, or push the date out — your choice.`;
    if(/mortgage/i.test(x.area)) return `Focus on one lever: lower the target price or clear a debt before buying.`;
    if(/variance/i.test(x.area)) return `Cap the over-budget category next month and watch it once.`;
    if(/data quality|data-quality/i.test(x.area)) return `Approve your pending records so the numbers can be trusted.`;
    return x.firstAction||'Take the first step listed on the card.';
  },

  enrich(db,r){
    r.all.forEach(x=>{
      x.effort=this.effort(x);
      x.effortLabel=this.effortLabel(x.effort);
      x.doNothing=this.doNothingCost(db,x);
      x.milestone=this.milestone(db,x);
      x.oneNumber=this.oneNumber(db,x);
      // easy-win score: high impact per unit effort
      x.easyWin = (x.dims.impact) / Math.max(10,x.effort);
    });
    return r;
  }
};

/* ============================================================
   SIMPLE MODE — Home view
   ============================================================ */
Views.home = function(){
  const db=Store.db;
  const ni=Calc.netIncome(db), out=Calc.totalBudgetedOutflow(db), left=Calc.monthlySurplus(db);
  const ess=RecoData.essentialExpenses(db), liquid=RecoData.liquidEmergency(db);
  const em = ess? liquid/ess : 0;
  const ecr = (ess+RecoData.minDebtPayments(db))? ni/(ess+RecoData.minDebtPayments(db)) : 9;
  // health verdict
  const st=ST();
  let verdict, vclass, vwhy;
  if(left<0 || ecr<st.coverage_floor){ verdict='Needs attention'; vclass='red'; vwhy='You are spending more than you bring in.'; }
  else if(em<st.reserve_stable_months || left/ni<st.margin_thin_pct/100){ verdict='Doing okay, one thing to watch'; vclass='amber'; vwhy='Your day-to-day is covered, but your safety cushion is thin.'; }
  else { verdict='You are stable'; vclass='green'; vwhy='Income covers your life with room to spare.'; }

  // top opportunity (run engine silently for the home card)
  let r=App.recoResult;
  if(!r){ r=Enhance.enrich(db, Reco.build(db)); }
  else if(!r.all[0] || r.all[0].effort===undefined){ Enhance.enrich(db,r); }
  const top = r.all.slice().sort((a,b)=>(a.rankTier-b.rankTier)||(b.score-a.score))[0];
  const easy = r.all.slice().filter(x=>x.effort<=30 && x!==top).sort((a,b)=>b.easyWin-a.easyWin).slice(0,2);

  const bar=(label,amt,color,pct)=>`<div style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${label}</span><span class="mono" style="font-family:var(--mono)">${fmtMoney(amt)}</span></div>
    <div class="bar-track" style="height:12px"><div class="bar-fill ${color}" style="width:${Math.max(3,Math.min(100,pct))}%"></div></div></div>`;
  const maxv=Math.max(ni,out,Math.abs(left),1);

  const dq=DataQuality.score(db);

  return `
  ${syntheticNote}
  <div class="section" style="border-left:3px solid var(--${vclass}-bd)">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="badge ${vclass}" style="font-size:13px;padding:6px 14px">${verdict}</span>
      <div style="font-size:15px;color:var(--text)">${vwhy}</div>
    </div>
    <div class="mini" style="margin-top:8px">Plain-language view. Want the full detail and every ratio? <a href="#" onclick="setMode('advanced');return false" style="color:var(--accent)">Switch to Advanced</a>.</div>
  </div>

  <div class="two-col">
    <div class="section">
      <h3>Money in, out, and left</h3>
      <div class="desc">The whole picture in three bars</div>
      ${bar('Money coming in', ni, 'green', ni/maxv*100)}
      ${bar('Money going out', out, 'amber', out/maxv*100)}
      ${bar(left>=0?'Money left over':'Shortfall', left, left>=0?'green':'red', Math.abs(left)/maxv*100)}
      <button class="btn ghost sm" onclick="RecoUI2.showMath()" style="margin-top:6px">Show the math</button>
    </div>

    <div class="section" style="border:1px solid var(--accent2)">
      <h3>Do this next</h3>
      <div class="desc">Your single highest-impact move right now</div>
      ${top? `
      <div style="font-size:16px;color:var(--text);font-weight:600;margin:6px 0 10px">${top.oneNumber}</div>
      <div class="kv"><span class="k">Why</span><span class="v" style="text-align:right;max-width:60%">${top.why}</span></div>
      <div class="kv"><span class="k">If you do nothing</span><span class="v" style="color:var(--amber)">${top.doNothing.note}</span></div>
      <div class="kv"><span class="k">Effort</span><span class="v">${badge(top.effort<=25?'green':top.effort<=55?'amber':'red',top.effortLabel)}</span></div>
      ${top.milestone?`<div class="kv"><span class="k">Milestone</span><span class="v" style="text-align:right;max-width:60%">${top.milestone}</span></div>`:''}
      <div class="btnrow" style="margin-top:12px">
        <button class="btn sm" onclick="setMode('advanced');App.go('recommendations');RecoUI.run&&RecoUI.run()">See full plan</button>
        <button class="btn ghost sm" onclick="Assistant.toggle();Assistant.ask('What is my highest-impact recommendation?')">Ask why</button>
      </div>` : '<div class="empty">Nothing urgent — you are on track.</div>'}
    </div>
  </div>

  ${easy.length?`<div class="section">
    <h3>Quick wins</h3>
    <div class="desc">Small moves, low effort, real payback</div>
    ${easy.map(x=>`<div class="kv"><span class="k">${badge('green',x.effortLabel)} ${x.oneNumber}</span><span class="v">${x.annual?fmtMoney(Math.abs(x.annual))+'/yr':''}</span></div>`).join('')}
  </div>`:''}

  <div class="section">
    <h3>Your safety cushion</h3>
    <div class="desc">${PLAIN['Emergency-fund months']}</div>
    <div style="display:flex;align-items:baseline;gap:10px"><div style="font-family:var(--mono);font-size:30px;font-weight:600;color:${em>=ST().reserve_stable_months?'var(--green)':em>=ST().reserve_min_months?'var(--amber)':'var(--red)'}">${em.toFixed(1)}</div><div style="color:var(--text2)">months covered</div></div>
    <div class="bar-track" style="margin-top:8px"><div class="bar-fill ${em>=ST().reserve_stable_months?'green':em>=ST().reserve_min_months?'amber':'red'}" style="width:${Math.min(100,em/Math.max(1,ST().reserve_stable_months*2)*100)}%"></div></div>
    <div class="mini" style="margin-top:6px">${Enhance.milestone(db,{area:'emergency',key:'em'})||''}</div>
  </div>

  ${dq.score<75?`<div class="banner"><span class="b-badge">Heads up</span> Some figures still need checking (data quality ${dq.score.toFixed(0)}). ${dq.gaps[0]||''} <a href="#" onclick="setMode('advanced');App.go('recommendations');return false" style="color:var(--accent)">Review</a></div>`:''}

  <div class="section">
    <button class="btn sec" onclick="RecoUI2.walkthrough()">Walk me through my money</button>
    <button class="btn ghost" onclick="RecoUI2.editThresholds()" style="margin-left:8px">Adjust my thresholds</button>
    <span class="mini" style="margin-left:10px">A guided review, or set what counts as green/amber/red for you.</span>
  </div>`;
};
Views._after_home=function(){};

/* ============================================================
   Simple-mode plumbing: nav reshape, toggle, math modal, walkthrough
   ============================================================ */
const SIMPLE_NAV_IDS = ['home','budget','goals','recommendations'];

const RecoUI2 = {
  reshapeNav(){
    // rebuild nav honoring mode; add Home + toggle. Never destroys NAV data.
    if(!NAV.find(n=>n.id==='home')){
      NAV.unshift({id:'home', label:'Home', sub:'Your money in plain language', ico:'M3 11l9-8 9 8 M5 10v10h14V10'});
    }
    const nav=document.getElementById('nav');
    const items = App.mode==='simple' ? NAV.filter(n=>SIMPLE_NAV_IDS.includes(n.id)) : NAV;
    nav.innerHTML = items.map(n=>`<button data-v="${n.id}" onclick="App.go('${n.id}')">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${n.ico}"/></svg>
      <span>${n.label}</span></button>`).join('')
      + `<div style="padding:10px 12px;margin-top:8px;border-top:1px solid var(--border)">
           <div class="mini" style="margin-bottom:6px">View</div>
           <div class="pill-tabs" style="width:100%">
             <button class="${App.mode==='simple'?'active':''}" style="flex:1" onclick="setMode('simple')">Simple</button>
             <button class="${App.mode==='advanced'?'active':''}" style="flex:1" onclick="setMode('advanced')">Advanced</button>
           </div>
         </div>`;
    // re-highlight
    document.querySelectorAll('#nav button[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===App.cur));
  },

  editThresholds(){
    const st=ST();
    const body=`
      <div class="mini" style="margin-bottom:10px">These set only when Simple Mode shows green, amber, or red. Your actual numbers and formulas never change.</div>
      <div class="form-grid">
        <div class="field"><label class="fld">"Thin margin" warning below (% of income)</label><input id="st-margin" type="number" step="1" value="${st.margin_thin_pct}"></div>
        <div class="field"><label class="fld">Safety cushion "stable" at (months)</label><input id="st-stable" type="number" step="0.5" value="${st.reserve_stable_months}"></div>
        <div class="field"><label class="fld">Safety cushion "critical" below (months)</label><input id="st-min" type="number" step="0.5" value="${st.reserve_min_months}"></div>
        <div class="field"><label class="fld">Essential-coverage floor (1.0 = income just covers essentials)</label><input id="st-cov" type="number" step="0.05" value="${st.coverage_floor}"></div>
      </div>`;
    modal('Adjust my thresholds', body, ()=>{
      st.margin_thin_pct=parseFloat(val('st-margin'))||st.margin_thin_pct;
      st.reserve_stable_months=parseFloat(val('st-stable'))||st.reserve_stable_months;
      st.reserve_min_months=parseFloat(val('st-min'))||st.reserve_min_months;
      st.coverage_floor=parseFloat(val('st-cov'))||st.coverage_floor;
      Store.db.settings.updated_at=nowISO();
      Store.log('settings','Adjusted Simple Mode thresholds');
      Store.save(); toast('Thresholds updated','green'); App.render();
    }, [{label:'Reset defaults',cls:'sec',fn:()=>{ Store.db.settings.simple={margin_thin_pct:5,reserve_stable_months:3,reserve_min_months:1,coverage_floor:1.0}; Store.log('settings','Reset Simple Mode thresholds'); Store.save(); closeModal(); toast('Reset to defaults','amber'); App.render(); }}]);
  },

  showMath(){
    const db=Store.db;
    const ni=Calc.netIncome(db), ex=Calc.totalExpenses(db), d=Calc.debtPayments(db), sv=Calc.plannedSavings(db), left=Calc.monthlySurplus(db);
    modal('Show the math', `
      <div class="calc" style="font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px;white-space:pre-wrap;color:var(--text2)">money_left = income − expenses − debt − savings
= ${fmtMoney(ni)} − ${fmtMoney(ex)} − ${fmtMoney(d)} − ${fmtMoney(sv)}
= ${fmtMoney(left)}</div>
      <div class="mini" style="margin-top:8px">These are your verified budget figures. Available credit is never counted as income.</div>`, null, []);
  },

  walkthrough(){
    const db=Store.db; const r=App.recoResult||Enhance.enrich(db,Reco.build(db));
    const ni=Calc.netIncome(db), left=Calc.monthlySurplus(db), ess=RecoData.essentialExpenses(db), liquid=RecoData.liquidEmergency(db);
    const em=ess?liquid/ess:0;
    const top=r.all.slice().sort((a,b)=>(a.rankTier-b.rankTier)||(b.score-a.score))[0];
    const steps=[
      {q:'First, are you living within your means?', a: left>=0? `Yes. You keep ${fmtMoney(left)} after everything each month.` : `Not yet. You're short ${fmtMoney(-left)} a month.`, ok:left>=0},
      {q:'Do you have a safety cushion?', a: em>=3? `Yes — about ${em.toFixed(1)} months covered.` : `Partly — ${em.toFixed(1)} months. Aim for at least 3.`, ok:em>=3},
      {q:'Is expensive debt under control?', a: (()=>{const hi=Calc.byType(db,'debt').slice().sort((x,y)=>(+y.apr)-(+x.apr))[0]; return hi&&+hi.apr>=15? `Watch ${hi.name} at ${(+hi.apr).toFixed(1)}% — it's your costliest.` : 'No high-rate debt flagged.';})(), ok:!(Calc.byType(db,'debt').some(c=>+c.apr>=15))},
      {q:'So what should you do next?', a: top? top.oneNumber : 'Keep going — nothing urgent.', ok:true, final:true}
    ];
    const body=steps.map((s,i)=>`<div style="margin-bottom:14px">
      <div style="font-weight:600;color:var(--text)">${i+1}. ${s.q}</div>
      <div style="color:var(--text2);margin-top:3px">${badge(s.final?'blue':s.ok?'green':'amber',s.final?'Next step':s.ok?'Good':'Watch')} ${s.a}</div>
    </div>`).join('');
    modal('Walk me through my money', body, null, [{label:'See full plan',cls:'sec',fn:()=>{closeModal();setMode('advanced');App.go('recommendations');}}]);
  }
};

/* ---------- hook engine run to enrich results ---------- */
(function hookRun(){
  if(typeof RecoUI==='undefined'||!RecoUI.run) return;
  const origRun=RecoUI.run.bind(RecoUI);
  RecoUI.run=function(){ origRun(); if(App.recoResult) Enhance.enrich(Store.db,App.recoResult); App.render(); };
})();

/* ---------- enrich the advanced action cards with the new fields ---------- */
(function extendCards(){
  if(typeof RecoUI==='undefined'||!RecoUI.card) return;
  const origCard=RecoUI.card.bind(RecoUI);
  RecoUI.card=function(x,rank){
    if(x.effort===undefined) Enhance.enrich(Store.db, App.recoResult||{all:[x]});
    let html=origCard(x,rank);
    // inject a plain-language strip right after the opening section div
    const strip=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px">
      ${badge(x.effort<=25?'green':x.effort<=55?'amber':'red','Effort: '+x.effortLabel)}
      ${x.doNothing&&x.doNothing.amt>0?badge('amber','Do nothing: '+fmtMoney2(x.doNothing.amt)+'/mo lost'):''}
      ${x.easyWin>=6?badge('green','Quick win'):''}
    </div>
    <div class="kv"><span class="k">In plain terms</span><span class="v" style="text-align:right;max-width:65%">${x.oneNumber}</span></div>`;
    // place strip after first </div> following the section-head close — simplest: after the h3 desc block.
    html=html.replace('</div>\n      </div>', '</div>\n      </div>'+strip);
    return html;
  };
})();

/* ---------- keep nav + pills correct on every navigation ---------- */
(function wrapGo(){
  const origGo=App.go.bind(App);
  App.go=function(id){ origGo(id); try{ RecoUI2.reshapeNav(); }catch(e){} };
})();

/* ---------- boot the simple layer ---------- */
(function bootSimple(){
  try{ RecoUI2.reshapeNav(); }catch(e){}
  if(App.mode==='simple'){ try{ App.go('home'); }catch(e){} }
})();

</script>
<script>
/* ===== borrowing.js (inlined) ===== */
/* ============================================================
   BORROWING READINESS  (extension module)
   Appended last. Generalizes the loan engine beyond mortgages to
   auto, personal, and student loans. Reuses Calc.pmt. The existing
   Mortgage Readiness view is preserved untouched as the "Mortgage"
   preset (linked, not replaced). Each loan type carries its own
   costs and its own sustainability lens; any modeled loan can be
   added to the budget (confirm-gated) so it flows into the existing
   DTI, cash-flow, and recommendation engine.
   ============================================================ */
'use strict';

/* ---- loan-type presets: what differs between financed purchases ---- */
const LOAN_TYPES = {
  auto: {
    label:'Auto loan', principalLabel:'Vehicle price', termDefault:6, rateDefault:0.079,
    dpLabel:'Down payment / trade-in', lens:'personal',
    carrying:[
      {key:'insurance_annual', label:'Auto insurance (annual)', def:1560},
      {key:'registration_annual', label:'Registration & fees (annual)', def:220},
      {key:'maintenance_annual', label:'Maintenance & repairs (annual)', def:900}
    ],
    note:'Front-end DTI does not apply to a vehicle. Judged by back-end DTI and payment-to-income.'
  },
  personal: {
    label:'Personal loan', principalLabel:'Loan amount', termDefault:4, rateDefault:0.119,
    dpLabel:'Upfront paid (if any)', lens:'personal',
    carrying:[],
    note:'Unsecured — no carrying costs beyond the payment. Judged by back-end DTI.'
  },
  student: {
    label:'Student loan', principalLabel:'Amount borrowed', termDefault:10, rateDefault:0.055,
    dpLabel:'Upfront paid (if any)', lens:'personal',
    carrying:[],
    note:'Judged by back-end DTI. Deferment/subsidy not modeled — planning estimate only.'
  }
};

/* ---- borrowing calc: shared amortization + type-specific costs + lens ---- */
const Borrow = {
  compute(db, type, inp){
    const t=LOAN_TYPES[type];
    const principal=Math.max(0, (+inp.principal||0) - (+inp.down||0));
    const pi=Calc.pmt(principal, +inp.rate, +inp.term_years);
    // carrying costs -> monthly
    let carryMonthly=0; const carryLines=[];
    (t.carrying||[]).forEach(c=>{ const v=+inp[c.key]||0; carryMonthly+=v/12; carryLines.push({label:c.label, monthly:v/12}); });
    const fullMonthly = pi + carryMonthly;
    // total interest over life
    const totalPaid = pi*(+inp.term_years*12);
    const totalInterest = Math.max(0, totalPaid - principal);
    // sustainability lens (personal): impact on existing DTI + cash flow
    const netIncome=Calc.netIncome(db);
    const grossIncome=Calc.grossIncome(db);
    const existingDebt=Calc.debtPayments(db);
    const currentBackNet = netIncome? existingDebt/netIncome*100 : 0;
    const newBackNet = netIncome? (existingDebt+pi)/netIncome*100 : 0;    // loan P&I adds to debt service
    const newBackGross = grossIncome? (existingDebt+pi)/grossIncome*100 : 0;
    const paymentToIncomeNet = netIncome? pi/netIncome*100 : 0;
    const fcfNow = Calc.monthlySurplus(db);
    const fcfAfter = fcfNow - fullMonthly;   // payment + carrying reduce free cash flow
    // affordability: max principal that keeps back-end DTI <= target on NET income
    const targetBack = (db.settings.assumptions.back_end_max||0.36); // reuse existing guide
    const maxPaymentNet = Math.max(0, netIncome*targetBack - existingDebt);
    const maxPrincipal = this.principalForPayment(maxPaymentNet, +inp.rate, +inp.term_years);
    return {type, t, principal, pi, carryMonthly, carryLines, fullMonthly, totalInterest, totalPaid,
      currentBackNet, newBackNet, newBackGross, paymentToIncomeNet, fcfNow, fcfAfter,
      maxPaymentNet, maxPrincipal, targetBack, netIncome, grossIncome, existingDebt};
  },
  // invert amortization: principal affordable for a given payment
  principalForPayment(payment, annualRate, years){
    const r=annualRate/12, n=years*12;
    if(payment<=0) return 0;
    if(r===0) return payment*n;
    return payment * (1-Math.pow(1+r,-n)) / r;
  },
  rateSensitivity(db,type,inp){
    const rates=[-0.02,-0.01,0,0.01,0.02,0.03];
    return rates.map(dr=>{ const c=this.compute(db,type,Object.assign({},inp,{rate:(+inp.rate)+dr})); return {rate:(+inp.rate)+dr, pi:c.pi, full:c.fullMonthly, back:c.newBackNet}; });
  }
};

/* ---- default draft per type ---- */
App.borrowType = App.borrowType || 'auto';
App.borrowDraft = App.borrowDraft || {};
function borrowDefaults(type){
  const t=LOAN_TYPES[type];
  const d={ principal: type==='auto'?32000:type==='personal'?12000:28000, down: type==='auto'?4000:0,
            rate:t.rateDefault, term_years:t.termDefault };
  (t.carrying||[]).forEach(c=> d[c.key]=c.def);
  return d;
}

/* ============================================================
   VIEW
   ============================================================ */
Views.borrowing=function(){
  const db=Store.db;
  const type=App.borrowType;
  if(!App.borrowDraft[type]) App.borrowDraft[type]=borrowDefaults(type);
  const inp=App.borrowDraft[type];
  const t=LOAN_TYPES[type];
  const c=Borrow.compute(db,type,inp);
  const backStatus=(v)=>v<=36?'green':v<=43?'amber':'red';
  const fld=(key,label,step,val)=>`<div class="field"><label class="fld">${label}</label><input type="number" step="${step||1}" value="${val}" oninput="App.borrowDraft['${type}']['${key}']=parseFloat(this.value)||0;App.render()"></div>`;
  const kv=(k,v,color)=>`<div class="kv"><span class="k">${k}</span><span class="v" ${color?`style="color:${color}"`:''}>${v}</span></div>`;

  const typeTabs=Object.keys(LOAN_TYPES).map(k=>`<button class="${type===k?'active':''}" onclick="App.borrowType='${k}';App.render()">${LOAN_TYPES[k].label}</button>`).join('');

  return `
  ${syntheticNote}
  <div class="banner"><span class="b-badge">Estimate</span> Borrowing figures are planning estimates, not a lender approval or credit decision. Adding a loan to your budget requires your confirmation.</div>

  <div class="section">
    <div class="section-head">
      <div><h3>What are you financing?</h3><div class="desc">Each loan type uses the same payment math but its own costs and the right way to judge it</div></div>
      <div class="pill-tabs">${typeTabs}</div>
    </div>
    <div class="banner info" style="margin:6px 0 0"><span class="b-badge" style="background:#0d2440;color:var(--accent);border-color:var(--accent2)">Mortgage</span>
      Buying a home? The dedicated <a href="#" onclick="App.go('mortgage');return false" style="color:var(--accent)">Mortgage Readiness</a> screen models property tax, insurance, HOA, PMI, maintenance, and closing reserves in full.</div>
  </div>

  <div class="two-col">
    <div class="section">
      <h3>${t.label} inputs</h3>
      <div class="form-grid">
        ${fld('principal',t.principalLabel,500,inp.principal)}
        ${fld('down',t.dpLabel,250,inp.down)}
        ${fld('rate','Interest rate (e.g. 0.079)',0.001,inp.rate)}
        ${fld('term_years','Term (years)',1,inp.term_years)}
        ${(t.carrying||[]).map(cc=>fld(cc.key,cc.label,50,inp[cc.key])).join('')}
      </div>
      <div class="mini" style="margin-top:8px">${t.note}</div>
    </div>

    <div class="section">
      <h3>Monthly cost</h3>
      ${kv('Principal &amp; interest',fmtMoney2(c.pi))}
      ${c.carryLines.map(l=>kv(l.label,fmtMoney2(l.monthly))).join('')}
      ${kv('Total monthly cost',fmtMoney2(c.fullMonthly),'var(--accent)')}
      <hr class="sep">
      ${kv('Total interest over life',fmtMoney(c.totalInterest))}
      ${kv('Total of payments',fmtMoney(c.totalPaid))}
      ${kv('Amount financed',fmtMoney(c.principal))}
    </div>
  </div>

  <div class="two-col">
    <div class="section">
      <h3>Can you sustain it?</h3>
      <div class="desc">Personal lens: effect on your debt load and cash flow</div>
      ${kv('Debt-to-income now (net)',fmtPct(c.currentBackNet), backStatus(c.currentBackNet)==='green'?'var(--green)':backStatus(c.currentBackNet)==='amber'?'var(--amber)':'var(--red)')}
      ${kv('Debt-to-income with this loan',fmtPct(c.newBackNet), backStatus(c.newBackNet)==='green'?'var(--green)':backStatus(c.newBackNet)==='amber'?'var(--amber)':'var(--red)')}
      <div class="mini">(existing debt + new payment) / net income</div>
      ${kv('Payment-to-income',fmtPct(c.paymentToIncomeNet))}
      <hr class="sep">
      ${kv('Free cash flow now',fmtMoney(c.fcfNow))}
      ${kv('Free cash flow after this loan',fmtMoney(c.fcfAfter), c.fcfAfter>=0?'var(--green)':'var(--red)')}
      ${c.fcfAfter<0?'<div class="mini" style="color:var(--red)">This loan would push your monthly cash flow negative.</div>':''}
    </div>
    <div class="section">
      <h3>How much could you afford?</h3>
      <div class="desc">Keeping back-end DTI at or under ${(c.targetBack*100).toFixed(0)}% on net income</div>
      ${kv('Max sustainable payment',fmtMoney2(c.maxPaymentNet))}
      ${kv('Max amount financed',fmtMoney(c.maxPrincipal),'var(--accent)')}
      <div class="mini">at ${(inp.rate*100).toFixed(2)}% over ${inp.term_years} years</div>
      <hr class="sep">
      <h3 style="font-size:12.5px;margin-top:6px">Payment by rate</h3>
      <div id="borrowRateChart" style="height:180px"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div><h3>Add this loan to your plan</h3><div class="desc">Creates a debt line in your budget so it flows into your DTI, cash flow, goals, and recommendations</div></div>
      <button class="btn" onclick="Borrow.addToBudget('${type}')">Add to budget</button>
    </div>
    <div class="mini">Requires confirmation. Nothing changes until you approve — consistent with every other verified-data change in the app.</div>
  </div>`;
};

Views._after_borrowing=function(){
  const db=Store.db, type=App.borrowType, inp=App.borrowDraft[type];
  if(!inp||!window.Highcharts) return;
  const sens=Borrow.rateSensitivity(db,type,inp);
  Highcharts.chart('borrowRateChart',{
    chart:{type:'column',backgroundColor:'transparent',style:{fontFamily:'var(--sans)'}},
    title:{text:null},credits:{enabled:false},
    xAxis:{categories:sens.map(s=>(s.rate*100).toFixed(2)+'%'),labels:{style:{color:'#adbac7'}},lineColor:'#30363d'},
    yAxis:{title:{text:null},labels:{style:{color:'#adbac7'}},gridLineColor:'#21262d'},
    legend:{enabled:false},
    tooltip:{backgroundColor:'#161b22',borderColor:'#30363d',style:{color:'#e6edf3'},valuePrefix:'$'},
    series:[{name:'Payment',data:sens.map(s=>Math.round(s.pi)),color:'#2f81f7'}]
  });
};

/* ---- add modeled loan to budget as a debt category (confirm-gated) ---- */
Borrow.addToBudget=function(type){
  const db=Store.db, inp=App.borrowDraft[type], t=LOAN_TYPES[type];
  const c=Borrow.compute(db,type,inp);
  const name=t.label+' (modeled)';
  if(!confirm(`Add "${name}" to your budget as a debt line of ${fmtMoney2(c.pi)}/mo (balance ${fmtMoney(c.principal)}, ${(inp.rate*100).toFixed(2)}% APR)? This changes your verified budget and will affect DTI, cash flow, and recommendations.`)) return;
  db.budget.push({ id:uid('cat'), name, type:'debt', budgeted:Math.round(c.pi), balance:Math.round(c.principal),
    apr:+(inp.rate*100).toFixed(2), minimum:Math.round(c.pi),
    created_at:nowISO(), updated_at:nowISO(), source:'user', verification_status:'verified', user_id:USER_ID });
  Store.log('borrowing', `Added ${name}: ${fmtMoney2(c.pi)}/mo, balance ${fmtMoney(c.principal)}, ${(inp.rate*100).toFixed(2)}% APR`);
  Store.save();
  toast(t.label+' added to budget','green');
  // refresh recommendation result if one exists so the new debt is reflected
  if(App.recoResult && typeof Reco!=='undefined'){ App.recoResult=Reco.build(db); if(typeof Enhance!=='undefined') Enhance.enrich(db,App.recoResult); }
  App.render();
};

/* ============================================================
   Wire into nav (both Simple and Advanced) — after Mortgage
   ============================================================ */
(function wireBorrowingNav(){
  if(!NAV.find(n=>n.id==='borrowing')){
    const idx=NAV.findIndex(n=>n.id==='mortgage');
    const entry={id:'borrowing', label:'Borrowing Readiness', sub:'Loans of any kind — can you sustain it?', ico:'M3 10h18 M5 10v8h14v-8 M9 21V14h6v7 M12 3l7 5H5z'};
    if(idx>=0) NAV.splice(idx+1,0,entry); else NAV.push(entry);
  }
  // include in simple-mode nav set if present
  try{ if(typeof SIMPLE_NAV_IDS!=='undefined' && !SIMPLE_NAV_IDS.includes('borrowing')) SIMPLE_NAV_IDS.push('borrowing'); }catch(e){}
  try{ if(typeof RecoUI2!=='undefined' && RecoUI2.reshapeNav) RecoUI2.reshapeNav(); else if(App.init) { /* fallback: rebuild base nav */ } }catch(e){}
  // rebuild the base nav DOM if reshapeNav isn't controlling it
  try{
    const nav=document.getElementById('nav');
    if(nav && (typeof App.mode==='undefined')){
      nav.innerHTML=NAV.map(n=>`<button data-v="${n.id}" onclick="App.go('${n.id}')">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${n.ico}"/></svg>
        <span>${n.label}</span></button>`).join('');
    }
  }catch(e){}
})();

</script>
