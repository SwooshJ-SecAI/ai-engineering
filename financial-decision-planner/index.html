<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Decision Planner</title>
<script src="/vendor/highcharts/highcharts.js"></script>
<script src="/vendor/highcharts/modules/accessibility.js"></script>
<style>
:root{
  --bg:#0d1117; --bg2:#010409; --surface:#161b22; --surface2:#1c2129;
  --text:#e6edf3; --text2:#adbac7; --muted:#768390; --border:#30363d; --border2:#21262d;
  --accent:#2f81f7; --accent2:#1f6feb;
  --green:#3fb950; --green-bg:#12261a; --green-bd:#238636;
  --amber:#d29922; --amber-bg:#2b2412; --amber-bd:#9e6a03;
  --red:#f85149; --red-bg:#2c1414; --red-bd:#da3633;
  --critical:#ff6b6b; --critical-bg:#3d1414;
  --mono:'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --radius:10px; --radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .2s ease}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.brand h1{font-size:15px;font-weight:600;letter-spacing:.2px}
.brand .tag{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:var(--text2);padding:9px 12px;border-radius:var(--radius-sm);font-size:13.5px;cursor:pointer;font-family:var(--sans);margin-bottom:2px;transition:background .12s,color .12s}
.nav button:hover{background:var(--surface);color:var(--text)}
.nav button.active{background:var(--surface2);color:var(--text);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.nav .nav-ico{width:16px;height:16px;flex:0 0 16px;opacity:.8}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.sidebar-foot .userchip{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sidebar-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}

.main{flex:1;margin-left:236px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(13,17,23,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px}
.topbar h2{font-size:18px;font-weight:600}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:1px}
.topbar .spacer{flex:1}
.hamburger{display:none;background:var(--surface);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:var(--radius-sm);cursor:pointer;font-size:16px}
.content{padding:24px;max-width:1400px;width:100%}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Components */
.banner{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:var(--radius-sm);padding:10px 14px;font-size:12.5px;color:var(--text2);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.banner.info{border-left-color:var(--accent)}
.banner .b-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:20px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.card .val{font-size:26px;font-weight:600;font-family:var(--mono);margin-top:8px;letter-spacing:-.5px}
.card .meta{font-size:12px;color:var(--text2);margin-top:5px}
.card .val.pos{color:var(--green)} .card .val.neg{color:var(--red)}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.section h3{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.section .desc{font-size:12px;color:var(--muted);margin-bottom:16px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid}
.badge.green{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.badge.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}
.badge.red{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.badge.critical{background:var(--critical-bg);color:var(--critical);border-color:var(--red-bd)}
.badge.gray{background:var(--surface2);color:var(--muted);border-color:var(--border)}
.badge.blue{background:#0d2440;color:var(--accent);border-color:var(--accent2)}
.badge.synthetic{background:var(--surface2);color:var(--muted);border-color:var(--border);text-transform:uppercase;letter-spacing:.04em;font-size:9.5px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border2);color:var(--text2)}
tr:hover td{background:var(--surface2)}
td.num,th.num{text-align:right;font-family:var(--mono)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
.tbl-wrap table th{background:var(--bg2)}

button.btn{background:var(--accent2);color:#fff;border:1px solid var(--accent2);padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:filter .12s}
button.btn:hover{filter:brightness(1.12)}
button.btn.sec{background:var(--surface2);color:var(--text);border-color:var(--border)}
button.btn.ghost{background:transparent;color:var(--text2);border-color:var(--border)}
button.btn.danger{background:transparent;color:var(--red);border-color:var(--red-bd)}
button.btn.sm{padding:5px 10px;font-size:12px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;font-family:var(--sans);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.fld{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.field{margin-bottom:0}
input[type=range]{padding:0;accent-color:var(--accent)}

.pill-tabs{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px;gap:2px}
.pill-tabs button{background:transparent;border:none;color:var(--text2);padding:5px 14px;border-radius:16px;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
.pill-tabs button.active{background:var(--surface2);color:var(--text);font-weight:600}

.bar-track{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:7px}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .4s ease}
.bar-fill.green{background:var(--green)} .bar-fill.amber{background:var(--amber)} .bar-fill.red{background:var(--red)}

.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border2);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)} .kv .v{font-family:var(--mono);color:var(--text)}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}

/* AI assistant */
.fab{position:fixed;right:22px;bottom:22px;z-index:60;width:54px;height:54px;border-radius:50%;background:var(--accent2);border:none;color:#fff;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.fab svg{width:24px;height:24px}
.assistant{position:fixed;right:22px;bottom:22px;z-index:61;width:400px;max-width:calc(100vw - 32px);height:560px;max-height:calc(100vh - 40px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.5);display:none;flex-direction:column;overflow:hidden}
.assistant.open{display:flex}
.asst-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.asst-head .t{font-size:14px;font-weight:600}
.asst-head .s{font-size:11px;color:var(--muted)}
.asst-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--accent2);color:#fff;border-bottom-right-radius:3px}
.msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg.bot .calc{font-family:var(--mono);font-size:11.5px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin:8px 0;white-space:pre-wrap;color:var(--text2)}
.msg.bot .tag{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:10px;margin-right:5px}
.msg.bot .tag.v{background:var(--green-bg);color:var(--green)} .msg.bot .tag.e{background:var(--amber-bg);color:var(--amber)}
.asst-foot{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.asst-foot input{flex:1}
.asst-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.asst-suggest button{background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:11px;padding:5px 9px;border-radius:14px;cursor:pointer;font-family:var(--sans)}
.asst-suggest button:hover{border-color:var(--accent);color:var(--text)}

.disabled-panel{border:1px dashed var(--border);border-radius:var(--radius);padding:40px 24px;text-align:center;background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(255,255,255,.012) 10px,rgba(255,255,255,.012) 20px)}
.disabled-panel .ico{font-size:30px;opacity:.4;margin-bottom:10px}
.disabled-panel h4{font-size:15px;margin-bottom:6px}
.disabled-panel p{font-size:12.5px;color:var(--muted);max-width:440px;margin:0 auto 4px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.chart-box{height:300px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;z-index:100;opacity:0;transition:all .25s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.green{border-left:3px solid var(--green)} .toast.red{border-left:3px solid var(--red)} .toast.amber{border-left:3px solid var(--amber)}

.modal-bg{position:fixed;inset:0;background:rgba(1,4,9,.7);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:15px}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.x-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}

.mini{font-size:11px;color:var(--muted)}
.stat-inline{display:flex;gap:22px;flex-wrap:wrap;margin-top:4px}
.stat-inline .si .n{font-family:var(--mono);font-size:18px;font-weight:600}
.stat-inline .si .l{font-size:11px;color:var(--muted)}
hr.sep{border:none;border-top:1px solid var(--border2);margin:16px 0}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:block}
  .two-col,.three-col{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>Financial Decision Planner</h1>
      <div class="tag">Private &middot; Local Prototype</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="userchip"><span class="dot"></span><span id="userLabel">local user</span></div>
      <div>All data stored privately on this device.</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
      <div>
        <h2 id="viewTitle">Overview</h2>
        <div class="sub" id="viewSub">Your financial position at a glance</div>
      </div>
      <div class="spacer"></div>
      <span class="badge synthetic" title="All records shown are synthetic demonstration data">Synthetic demo data</span>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- AI assistant -->
<button class="fab" id="fab" onclick="Assistant.toggle()" title="Ask the financial assistant">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>
<div class="assistant" id="assistant">
  <div class="asst-head">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 2"/></svg>
    <div style="flex:1"><div class="t">Financial Assistant</div><div class="s">Grounded in your stored data only</div></div>
    <button class="x-btn" onclick="Assistant.toggle()">&times;</button>
  </div>
  <div class="asst-body" id="asstBody"></div>
  <div class="asst-suggest" id="asstSuggest"></div>
  <div class="asst-foot">
    <input id="asstInput" placeholder="Ask about your finances..." onkeydown="if(event.key==='Enter')Assistant.send()">
    <button class="btn" onclick="Assistant.send()">Ask</button>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== app.js (inlined) ===== */
/* ============================================================
   Financial Decision Planner  —  private, user-scoped prototype
   All data is SYNTHETIC and stored locally (localStorage),
   scoped per user_id. No shared storage is used.
   ============================================================ */

'use strict';

/* ---------- User scope & storage ---------- */
const USER_ID = 'local-user-001';                 // user-scoped key namespace
const STORE_KEY = 'fdp::' + USER_ID + '::v1';
const nowISO = () => new Date().toISOString();
const fmtMoney = (n) => (n<0?'-':'') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const fmtMoney2 = (n) => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = (n,d=1) => (n>=0?'':'') + n.toFixed(d) + '%';
const fmtDate = (iso) => { if(!iso) return '\u2014'; const d=new Date(iso); return d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); };
const uid = (p='id') => p+'-'+Math.random().toString(36).slice(2,9);
const clone = (o) => JSON.parse(JSON.stringify(o));

/* ---------- Synthetic seed data (clearly labelled) ---------- */
function seedData(){
  const audit = [];
  const stamp = (o)=>Object.assign({created_at:nowISO(),updated_at:nowISO(),source:'synthetic-seed',verification_status:'verified',user_id:USER_ID},o);
  return {
    meta:{ synthetic:true, created_at:nowISO(), user_id:USER_ID, schema:'v1' },
    settings:{
      user_id:USER_ID,
      display_name:'Alex Rivera (synthetic)',
      currency:'USD',
      thresholds:{ green:5, amber:10 },      // % unfavorable bands; >amber = red; cashflow<0 = critical
      assumptions:{
        default_return:0.06,                  // annual expected return for goals
        inflation:0.03,
        emergency_fund_target_months:6,
        maintenance_reserve_pct:0.01,         // % of home price / yr
        default_rate:0.0675,                  // mortgage APR
        default_term_years:30,
        pmi_annual_pct:0.0075,                // if down payment < 20%
        front_end_max:0.28,
        back_end_max:0.36,
        conservative_back_end:0.28,
        balanced_back_end:0.33
      },
      created_at:nowISO(), updated_at:nowISO(), source:'synthetic-seed', verification_status:'verified'
    },
    income:[
      stamp({id:uid('inc'), name:'Primary salary (net)', gross:7200, amount:5450, cadence:'monthly'}),
      stamp({id:uid('inc'), name:'Freelance (net)', gross:900, amount:720, cadence:'monthly'})
    ],
    budget:[
      // type: fixed | variable | debt | savings | sinking
      stamp({id:uid('cat'), name:'Rent', type:'fixed', budgeted:1850}),
      stamp({id:uid('cat'), name:'Utilities', type:'fixed', budgeted:240}),
      stamp({id:uid('cat'), name:'Insurance (auto+health)', type:'fixed', budgeted:310}),
      stamp({id:uid('cat'), name:'Phone & internet', type:'fixed', budgeted:145}),
      stamp({id:uid('cat'), name:'Groceries', type:'variable', budgeted:620}),
      stamp({id:uid('cat'), name:'Dining & takeout', type:'variable', budgeted:280}),
      stamp({id:uid('cat'), name:'Transportation & fuel', type:'variable', budgeted:210}),
      stamp({id:uid('cat'), name:'Entertainment', type:'variable', budgeted:160}),
      stamp({id:uid('cat'), name:'Shopping & personal', type:'variable', budgeted:190}),
      stamp({id:uid('cat'), name:'Student loan', type:'debt', budgeted:380, balance:14200, apr:5.5, minimum:280}),
      stamp({id:uid('cat'), name:'Auto loan', type:'debt', budgeted:410, balance:12800, apr:6.9, minimum:410}),
      stamp({id:uid('cat'), name:'Credit card', type:'debt', budgeted:250, balance:3600, apr:22.9, minimum:110}),
      stamp({id:uid('cat'), name:'Emergency fund', type:'savings', budgeted:400}),
      stamp({id:uid('cat'), name:'Retirement (Roth)', type:'savings', budgeted:500}),
      stamp({id:uid('cat'), name:'Home down-payment fund', type:'sinking', budgeted:600}),
      stamp({id:uid('cat'), name:'Car maintenance sinking', type:'sinking', budgeted:90}),
      stamp({id:uid('cat'), name:'Annual gifts sinking', type:'sinking', budgeted:75})
    ],
    // actuals keyed by month (YYYY-MM) -> {catId: actual}
    actuals:{},
    transactions:[],   // filled below
    accounts:[
      stamp({id:uid('acct'), name:'Checking (synthetic)', mask:'****4821', type:'checking', balance:4180}),
      stamp({id:uid('acct'), name:'Savings (synthetic)', mask:'****9930', type:'savings', balance:11400}),
      stamp({id:uid('acct'), name:'Brokerage (synthetic)', mask:'****2277', type:'investment', balance:23850}),
      stamp({id:uid('acct'), name:'Down-payment fund', mask:'****6644', type:'savings', balance:9600})
    ],
    goals:[
      stamp({id:uid('goal'), name:'6-month emergency fund', target:22800, current:11400, target_date:addMonths(6), priority:'High', exp_return:0.03}),
      stamp({id:uid('goal'), name:'Home down payment', target:60000, current:9600, target_date:addMonths(30), priority:'High', exp_return:0.04}),
      stamp({id:uid('goal'), name:'New car fund', target:12000, current:2100, target_date:addMonths(20), priority:'Medium', exp_return:0.03}),
      stamp({id:uid('goal'), name:'Vacation 2027', target:5000, current:900, target_date:addMonths(11), priority:'Low', exp_return:0.02})
    ],
    mortgage:{
      gross_monthly:8100, net_monthly:6170, existing_debt:1040,
      rate:0.0675, term_years:30,
      property_tax_annual:5400, insurance_annual:1560, hoa_monthly:0, pmi_annual_pct:0.0075,
      down_payment:60000, closing_pct:0.03, maintenance_pct:0.01, emergency_required:13600,
      home_price:340000,
      created_at:nowISO(), updated_at:nowISO(), source:'synthetic-seed', verification_status:'verified'
    },
    scenarios:[],   // user-created; baseline computed live
    documents:[],   // populated with synthetic pending-review records
    reconcile:[],   // review queue
    audit:[]
  };
}

function addMonths(m){ const d=new Date(); d.setMonth(d.getMonth()+m); return d.toISOString(); }
function ymNow(off=0){ const d=new Date(); d.setMonth(d.getMonth()+off); return d.toISOString().slice(0,7); }

/* Synthetic transactions across recent months + edge cases for variance flags */
function seedTransactions(db){
  const cats = db.budget;
  const catByName = (n)=>cats.find(c=>c.name===n);
  const months = [ymNow(-2), ymNow(-1), ymNow(0)];
  const tx = [];
  const push = (o)=>tx.push(Object.assign({id:uid('tx'),created_at:nowISO(),updated_at:nowISO(),source:'synthetic-seed',verification_status:'verified',user_id:USER_ID,flags:[]},o));
  const vendors = {
    'Groceries':['Whole Foods','Trader Joes','Safeway','Costco'],
    'Dining & takeout':['Chipotle','Local Bistro','DoorDash','Starbucks'],
    'Transportation & fuel':['Shell','Chevron','Uber','Transit Pass'],
    'Entertainment':['Netflix','AMC Theaters','Spotify','Steam'],
    'Shopping & personal':['Amazon','Target','REI','Nordstrom'],
    'Utilities':['City Power','Water Dept'],
    'Rent':['Maple Grove Apts'],
    'Insurance (auto+health)':['StateWide Insurance'],
    'Phone & internet':['Verizon','Xfinity']
  };
  months.forEach((ym,mi)=>{
    Object.keys(vendors).forEach(cn=>{
      const cat=catByName(cn); if(!cat) return;
      const n = (cn==='Rent'||cn==='Insurance (auto+health)'||cn==='Phone & internet')?1:(cn==='Utilities'?2:3);
      let spent=0;
      for(let i=0;i<n;i++){
        const v=vendors[cn][i%vendors[cn].length];
        let amt = cat.budgeted/n * (0.7+Math.random()*0.7);
        amt = Math.round(amt*100)/100;
        spent+=amt;
        const day = String(2+Math.floor(Math.random()*25)).padStart(2,'0');
        push({date:ym+'-'+day, description:v, merchant:v, amount:amt, catId:cat.id, category:cn, month:ym, type:'debit'});
      }
    });
  });
  // Edge cases (current month) for variance/anomaly flags:
  const g=catByName('Groceries'), d=catByName('Dining & takeout'), e=catByName('Entertainment');
  const cm=ymNow(0);
  // Duplicate pair
  push({date:cm+'-14', description:'Costco', merchant:'Costco', amount:142.88, catId:g.id, category:'Groceries', month:cm, type:'debit', flags:['duplicate']});
  push({date:cm+'-14', description:'Costco', merchant:'Costco', amount:142.88, catId:g.id, category:'Groceries', month:cm, type:'debit', flags:['duplicate']});
  // Unusual large
  push({date:cm+'-19', description:'Best Buy - laptop', merchant:'Best Buy', amount:1284.00, catId:catByName('Shopping & personal').id, category:'Shopping & personal', month:cm, type:'debit', flags:['unusual']});
  // Uncategorized
  push({date:cm+'-20', description:'SQ *UNKNOWN VENDOR', merchant:'Square', amount:64.50, catId:null, category:null, month:cm, type:'debit', flags:['uncategorized']});
  // Recurring subscription flagged
  push({date:cm+'-03', description:'Adobe Creative Cloud', merchant:'Adobe', amount:59.99, catId:e.id, category:'Entertainment', month:cm, type:'debit', flags:['recurring']});
  db.transactions = tx;

  // Build actuals from transactions (verified) per month
  const actuals={};
  months.forEach(ym=>{ actuals[ym]={}; });
  tx.forEach(t=>{ if(!t.catId) return; if(!actuals[t.month]) actuals[t.month]={}; actuals[t.month][t.catId]=(actuals[t.month][t.catId]||0)+t.amount; });
  // Force some deliberate variance signatures in current month
  const cur=actuals[cm];
  cur[catByName('Dining & takeout').id] = 372;     // over budget (red)
  cur[catByName('Groceries').id] = 705;            // over (amber/red)
  cur[catByName('Entertainment').id] = 168;        // slight over (green/amber edge)
  cur[catByName('Transportation & fuel').id] = 196;// under (favorable)
  db.actuals = actuals;
}

/* ---------- Store ---------- */
const Store = {
  db:null,
  load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){ this.db = JSON.parse(raw); return; }
    }catch(e){ console.warn('load failed',e); }
    this.reset(false);
  },
  save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(this.db)); }catch(e){ console.warn('save failed',e); } },
  reset(save=true){
    const db = seedData();
    seedTransactions(db);
    seedDocuments(db);
    db.audit=[];
    this.db=db;
    this.log('system','Initialized synthetic demonstration dataset');
    if(save) this.save();
  },
  log(kind, detail, extra){
    this.db.audit.unshift({id:uid('aud'), at:nowISO(), kind, detail, extra:extra||null, user_id:USER_ID});
    if(this.db.audit.length>500) this.db.audit.length=500;
  }
};

/* ============================================================
   CALCULATION ENGINE  (pure functions; the single source of truth)
   ============================================================ */
const Calc = {
  netIncome(db){ return db.income.reduce((s,i)=>s+(+i.amount||0),0); },      // NEVER counts available credit
  grossIncome(db){ return db.income.reduce((s,i)=>s+(+i.gross||i.amount||0),0); },
  byType(db,t){ return db.budget.filter(c=>c.type===t); },
  sumType(db,t){ return this.byType(db,t).reduce((s,c)=>s+(+c.budgeted||0),0); },
  totalExpenses(db){ return this.sumType(db,'fixed')+this.sumType(db,'variable'); },   // living expenses
  debtPayments(db){ return this.sumType(db,'debt'); },
  plannedSavings(db){ return this.sumType(db,'savings')+this.sumType(db,'sinking'); },
  monthlySurplus(db){
    return this.netIncome(db) - this.totalExpenses(db) - this.debtPayments(db) - this.plannedSavings(db);
  },
  totalBudgetedOutflow(db){ return this.totalExpenses(db)+this.debtPayments(db)+this.plannedSavings(db); },
  freeCashFlow(db){ return this.monthlySurplus(db); },
  savingsRate(db){ const ni=this.netIncome(db); return ni?((this.plannedSavings(db))/ni*100):0; },
  totalDebt(db){ return this.byType(db,'debt').reduce((s,c)=>s+(+c.balance||0),0); },
  dti(db){ const ni=this.netIncome(db); return ni?(this.debtPayments(db)/ni*100):0; },
  emergencyMonths(db){
    const ef = db.accounts.filter(a=>/emergency|savings/i.test(a.name)||a.type==='savings').reduce((s,a)=>s+(+a.balance||0),0);
    const need = this.totalExpenses(db)+this.debtPayments(db);
    return need? ef/need : 0;
  },
  netWorth(db){
    const assets = db.accounts.reduce((s,a)=>s+(+a.balance||0),0);
    return assets - this.totalDebt(db);
  },
  actualsForMonth(db,ym){ return db.actuals[ym]||{}; },
  budgetUtilization(db,ym){
    const a=this.actualsForMonth(db,ym); const spentCats=this.byType(db,'fixed').concat(this.byType(db,'variable'));
    const bud=spentCats.reduce((s,c)=>s+(+c.budgeted||0),0);
    const act=spentCats.reduce((s,c)=>s+(+a[c.id]||0),0);
    return bud? act/bud*100 : 0;
  },
  variance(cat, actual){
    const b=+cat.budgeted||0; const va=actual-b; const vp = b? (va/b*100):0;
    return {budgeted:b, actual, variance_amount:va, variance_percentage:vp};
  },
  varianceStatus(db, cat, actual, projectedCashFlow){
    const {variance_percentage} = this.variance(cat, actual);
    const th=db.settings.thresholds;
    // Unfavorable = spending over budget for expense/debt; under target for savings is unfavorable too
    const isSpend = (cat.type==='fixed'||cat.type==='variable'||cat.type==='debt');
    let unfav; // signed unfavorable %
    if(isSpend) unfav = variance_percentage;          // positive = over spend = bad
    else unfav = -variance_percentage;                // savings: under target = positive unfav
    if(projectedCashFlow!==undefined && projectedCashFlow<0) return 'critical';
    if(unfav<=th.green) return 'green';
    if(unfav<=th.amber) return 'amber';
    return 'red';
  },
  varianceRows(db,ym){
    const a=this.actualsForMonth(db,ym);
    return db.budget.filter(c=>c.type!=='savings'||true).map(c=>{
      const act = +a[c.id]||0;
      const v=this.variance(c,act);
      const status=this.varianceStatus(db,c,act);
      return Object.assign({cat:c, category:c.name, type:c.type}, v, {status});
    });
  },
  topUnfavorable(db,ym,n=3){
    return this.varianceRows(db,ym)
      .filter(r=>(r.type==='fixed'||r.type==='variable'||r.type==='debt') && r.variance_amount>0)
      .sort((x,y)=>y.variance_amount-x.variance_amount).slice(0,n);
  },

  /* Goals */
  monthsBetween(fromISO,toISO){
    const a=new Date(fromISO||nowISO()), b=new Date(toISO);
    return Math.max(1, (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()));
  },
  goalCompute(db, g){
    const months=this.monthsBetween(nowISO(), g.target_date);
    const r=(+g.exp_return||0)/12;
    // expected growth on current balance over the horizon (simple compounding of current only)
    const fvCurrent = r? (+g.current)*Math.pow(1+r,months) : (+g.current);
    const expected_growth = fvCurrent - (+g.current);
    const remaining = Math.max(0, (+g.target) - (+g.current) - expected_growth);
    const required_monthly = remaining / months;
    const weekly = required_monthly*12/52;
    // current contribution: infer from a savings/sinking budget line matching by name, else 0
    const match = db.budget.find(c=>(c.type==='savings'||c.type==='sinking') && namesMatch(c.name,g.name));
    const current_contribution = match? (+match.budgeted||0) : 0;
    const gap = required_monthly - current_contribution;
    // projected completion at current contribution
    let proj=null;
    if(current_contribution>0){
      const need=(+g.target)-(+g.current);
      const m=Math.ceil(need/ (current_contribution + (r? (+g.current)*r : 0)));
      const dt=new Date(); dt.setMonth(dt.getMonth()+Math.max(1,m)); proj=dt.toISOString();
    }
    const progress = Math.min(100, (+g.current)/(+g.target)*100);
    return {months, required_monthly, weekly, current_contribution, gap, projected:proj, progress, expected_growth};
  },

  /* Mortgage */
  pmt(principal, annualRate, years){
    const r=annualRate/12, n=years*12;
    if(r===0) return principal/n;
    return principal * r / (1-Math.pow(1+r,-n));
  },
  mortgage(db, override){
    const m=Object.assign({}, db.mortgage, override||{});
    const price=+m.home_price, dp=+m.down_payment;
    const loan=Math.max(0, price-dp);
    const pi=this.pmt(loan, +m.rate, +m.term_years);
    const tax=(+m.property_tax_annual)/12;
    const ins=(+m.insurance_annual)/12;
    const hoa=(+m.hoa_monthly)||0;
    const ltv = price? loan/price : 0;
    const pmi = (ltv>0.8) ? (loan*(+m.pmi_annual_pct))/12 : 0;
    const maint = (price*(+m.maintenance_pct))/12;
    const housing_payment = pi+tax+ins+hoa+pmi;         // PITI+HOA+PMI (lender housing ratio)
    const full_ownership = pi+tax+ins+hoa+pmi+maint;    // + maintenance reserve
    const gross=+m.gross_monthly;
    const front = gross? housing_payment/gross*100 : 0;
    const back = gross? (housing_payment + (+m.existing_debt))/gross*100 : 0;
    const closing = price*(+m.closing_pct);
    const cash_needed = dp + closing;
    const reserves_after = (db.accounts.reduce((s,a)=>s+(+a.balance||0),0)) - cash_needed;
    return {loan,pi,tax,ins,hoa,pmi,maint,housing_payment,full_ownership,front,back,closing,cash_needed,reserves_after,ltv,price,dp,
            emergency_required:+m.emergency_required, gross, existing_debt:+m.existing_debt, rate:+m.rate, term:+m.term_years};
  },
  // affordable home price for a target back-end DTI
  affordableForDTI(db, targetBackPct){
    const m=db.mortgage; const gross=+m.gross_monthly;
    const maxHousing = gross*targetBackPct - (+m.existing_debt);
    if(maxHousing<=0) return {price:0,housing:0};
    // solve iteratively for price where housing_payment == maxHousing
    let lo=0, hi=2000000;
    for(let i=0;i<60;i++){
      const mid=(lo+hi)/2;
      const r=this.mortgage(db,{home_price:mid});
      if(r.housing_payment>maxHousing) hi=mid; else lo=mid;
    }
    const price=(lo+hi)/2; const r=this.mortgage(db,{home_price:price});
    return {price, housing:r.housing_payment, dti:targetBackPct*100};
  },
  rateSensitivity(db){
    const rates=[-0.01,-0.005,0,0.005,0.01,0.02];
    return rates.map(dr=>{ const r=this.mortgage(db,{rate:(+db.mortgage.rate)+dr}); return {rate:(+db.mortgage.rate)+dr, pi:r.pi, housing:r.housing_payment, back:r.back}; });
  },

  /* Scenario baseline snapshot */
  baseline(db){
    const ym=ymNow(0);
    const mtg=this.mortgage(db);
    return {
      label:'Baseline (immutable)',
      net_income:this.netIncome(db), expenses:this.totalExpenses(db), debt:this.debtPayments(db),
      savings:this.plannedSavings(db), surplus:this.monthlySurplus(db),
      dti:this.dti(db), emergency_months:this.emergencyMonths(db),
      housing:mtg.housing_payment, back_end:mtg.back, front_end:mtg.front,
      home_price:mtg.price, net_worth:this.netWorth(db)
    };
  }
};
function namesMatch(a,b){ a=a.toLowerCase(); b=b.toLowerCase();
  const key=(s)=>s.replace(/[^a-z]/g,''); const A=key(a),B=key(b);
  if(A.includes('emergency')&&B.includes('emergency'))return true;
  if(A.includes('down')&&B.includes('down'))return true;
  if((A.includes('car')||A.includes('auto'))&&(B.includes('car')||B.includes('vehicle')))return true;
  if(A.includes('vacation')&&B.includes('vacation'))return true;
  return false;
}

/* boot store immediately */
Store.load();

</script>

/* ---------- shared render helpers ---------- */
const typeLabel={fixed:'Fixed',variable:'Variable',debt:'Debt',savings:'Savings',sinking:'Sinking fund'};
const badge=(status,text)=>`<span class="badge ${status}">${text||status}</span>`;
const syntheticNote='<div class="banner"><span class="b-badge">Synthetic</span> All records are synthetic demonstration data generated locally. No real financial data is present.</div>';

/* ============================================================
   VIEWS
   ============================================================ */
const Views={};

/* ---------- OVERVIEW ---------- */
Views.overview=function(){
  const db=Store.db, ym=App.varMonth;
  const ni=Calc.netIncome(db), exp=Calc.totalExpenses(db), debt=Calc.debtPayments(db);
  const fcf=Calc.freeCashFlow(db), sr=Calc.savingsRate(db), em=Calc.emergencyMonths(db);
  const td=Calc.totalDebt(db), dti=Calc.dti(db), nw=Calc.netWorth(db);
  const util=Calc.budgetUtilization(db,ym);
  const top=Calc.topUnfavorable(db,ym,3);
  const mtg=Calc.mortgage(db);
  const mReady = mtg.back<=db.settings.assumptions.back_end_max*100 && mtg.front<=db.settings.assumptions.front_end_max*100 && mtg.reserves_after>=mtg.emergency_required;
  const mStatus = mReady?'green':(mtg.back<=40?'amber':'red');
  const card=(lbl,val,cls,meta)=>`<div class="card"><div class="lbl">${lbl}</div><div class="val ${cls||''}">${val}</div>${meta?`<div class="meta">${meta}</div>`:''}</div>`;
  const goalsHtml = db.goals.map(g=>{const gc=Calc.goalCompute(db,g);const st=gc.progress>=75?'green':gc.progress>=40?'amber':'red';
    return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${g.name}</span><span class="mono">${fmtMoney(g.current)} / ${fmtMoney(g.target)}</span></div><div class="bar-track"><div class="bar-fill ${st}" style="width:${gc.progress}%"></div></div></div>`;}).join('');
  return `
  ${syntheticNote}
  <div class="grid cards" style="margin-bottom:18px">
    ${card('Net monthly income',fmtMoney(ni),'','Credit lines never counted')}
    ${card('Total monthly expenses',fmtMoney(exp),'','Fixed + variable')}
    ${card('Free cash flow',fmtMoney(fcf),fcf>=0?'pos':'neg','After expenses, debt &amp; savings')}
    ${card('Savings rate',fmtPct(sr),sr>=15?'pos':'', 'Of net income')}
    ${card('Emergency-fund months',em.toFixed(1),em>=6?'pos':em>=3?'':'neg','Target '+db.settings.assumptions.emergency_fund_target_months+' months')}
    ${card('Total debt',fmtMoney(td),'','Across '+Calc.byType(db,'debt').length+' accounts')}
    ${card('Debt-to-income',fmtPct(dti),dti<=15?'pos':dti<=25?'':'neg','Payments / net income')}
    ${card('Net worth',fmtMoney(nw),nw>=0?'pos':'neg','Assets - debt')}
    ${card('Budget utilization',fmtPct(util),util<=100?'':'neg',fmtDate(ym+'-01').replace(/,.*/,''))}
  </div>
  <div class="two-col">
    <div class="section">

/* ---------- SCENARIO LAB ---------- */
Views.scenario=function(){
  const db=Store.db, base=Calc.baseline(db);
  if(!App.scenario) App.scenario={income_delta:0,expense_delta:0,debt_delta:0,home_price:db.mortgage.home_price,rate:db.mortgage.rate,down_payment:db.mortgage.down_payment,target_delta:0,savings_delta:0,inflation:db.settings.assumptions.inflation,onetime:0};
  const s=App.scenario;
  // compute scenario
  const ni=base.net_income+ +s.income_delta;
  const exp=base.expenses+ +s.expense_delta;
  const debt=base.debt+ +s.debt_delta;
  const sav=base.savings+ +s.savings_delta;
  const surplus=ni-exp-debt-sav - (+s.onetime)/12;
  const mtg=Calc.mortgage(db,{home_price:+s.home_price,rate:+s.rate,down_payment:+s.down_payment});
  const em=(db.accounts.reduce((a,x)=>a+(+x.balance||0),0) - (+s.onetime))/((exp+debt)||1);
  const dti=ni?debt/ni*100:0;
  const row=(lbl,b,v,fmt,better)=>{const d=v-b;const good=better==='up'?d>=0:d<=0;
    return `<tr><td>${lbl}</td><td class="num">${fmt(b)}</td><td class="num">${fmt(v)}</td><td class="num" style="color:${d===0?'var(--muted)':good?'var(--green)':'var(--red)'}">${d>0?'+':''}${fmt(d)}</td></tr>`;};
  const sl=(lbl,key,min,max,step,val,fmt)=>`<div class="field"><label class="fld">${lbl}: <span style="color:var(--text)">${fmt(val)}</span></label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="App.scenario.${key}=+this.value;App.render()"></div>`;
  return `
  ${syntheticNote}
  <div class="banner info"><span class="b-badge" style="background:#0d2440;color:var(--accent);border-color:var(--accent2)">Baseline locked</span> The baseline is immutable. Adjust the levers below to compare scenarios against it.</div>
  <div class="section">
    <div class="section-head"><div><h3>Scenario levers</h3><div class="desc">Adjust and compare instantly</div></div>
    <button class="btn sec sm" onclick="App.scenario=null;App.render()">Reset to baseline</button></div>
    <div class="form-grid">
      ${sl('Income change (monthly)','income_delta',-3000,3000,50,s.income_delta,fmtMoney)}
      ${sl('Expense change (monthly)','expense_delta',-2000,2000,50,s.expense_delta,fmtMoney)}
      ${sl('Debt payment change','debt_delta',-1500,1500,50,s.debt_delta,fmtMoney)}
      ${sl('Savings contribution change','savings_delta',-1500,1500,50,s.savings_delta,fmtMoney)}
      ${sl('Home price','home_price',150000,900000,5000,s.home_price,fmtMoney)}
      ${sl('Interest rate','rate',0.03,0.10,0.00125,s.rate,(v)=>(v*100).toFixed(3)+'%')}
      ${sl('Down payment','down_payment',0,200000,2500,s.down_payment,fmtMoney)}
      ${sl('One-time expense','onetime',0,50000,500,s.onetime,fmtMoney)}
      ${sl('Inflation assumption','inflation',0,0.08,0.0025,s.inflation,(v)=>(v*100).toFixed(2)+'%')}
    </div>
  </div>
  <div class="section">
    <h3>Baseline vs scenario</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Metric</th><th class="num">Baseline</th><th class="num">Scenario</th><th class="num">Change</th></tr></thead><tbody>
      ${row('Monthly cash flow',base.surplus,surplus,fmtMoney,'up')}
      ${row('Debt-to-income',base.dti,dti,(v)=>fmtPct(v),'down')}
      ${row('Emergency reserves (months)',base.emergency_months,em,(v)=>v.toFixed(1),'up')}
      ${row('Housing payment',base.housing,mtg.housing_payment,fmtMoney,'down')}
      ${row('Back-end DTI (housing)',base.back_end,mtg.back,(v)=>fmtPct(v),'down')}
      ${row('Affordable home price',base.home_price,mtg.price,fmtMoney,'up')}
    </tbody></table></div>
    <hr class="sep">
    <h3>Recommended actions</h3>
    ${scenarioAdvice(base,{surplus,dti,em,mtg}).map(a=>`<div class="kv"><span class="k">${badge(a.level)} ${a.text}</span><span class="v"></span></div>`).join('')}
    <div class="btnrow" style="margin-top:14px"><button class="btn sm" onclick="Actions.saveScenario()">Save this scenario</button></div>
  </div>`;
};
function scenarioAdvice(b,s){
  const out=[];
  if(s.surplus<0) out.push({level:'red',text:'Scenario runs a monthly deficit \u2014 reduce expenses or debt before proceeding.'});
  else if(s.surplus<b.surplus) out.push({level:'amber',text:'Cash flow drops versus baseline; confirm the trade-off is intentional.'});
  else out.push({level:'green',text:'Cash flow improves or holds versus baseline.'});
  if(s.mtg.back>36) out.push({level:'red',text:'Back-end DTI exceeds 36% \u2014 lenders may decline; lower price or debt.'});
  else if(s.mtg.back>28) out.push({level:'amber',text:'Back-end DTI in caution range (28\u201336%).'});
  if(s.em<3) out.push({level:'red',text:'Emergency reserves fall below 3 months.'});
  else if(s.em<6) out.push({level:'amber',text:'Emergency reserves below the 6-month target.'});
  return out;
}

/* ---------- modal + toast ---------- */
function modal(title, body, onSave, extraBtns){
  const mb=document.getElementById('modalBg'), m=document.getElementById('modal');
  const extra=(extraBtns||[]).map((b,i)=>`<button class="btn ${b.cls||'sec'} sm" data-x="${i}">${b.label}</button>`).join('');
  m.innerHTML=`<div class="modal-head"><h3>${title}</h3><button class="x-btn" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${extra}<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" id="modalSave">Save</button></div>`;
  mb.classList.add('open');
  document.getElementById('modalSave').onclick=()=>{ onSave&&onSave(); closeModal(); };
  (extraBtns||[]).forEach((b,i)=>{ m.querySelector(`[data-x="${i}"]`).onclick=b.fn; });
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });
function toast(msg,cls){ const t=document.getElementById('toast'); t.className='toast '+(cls||''); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

/* ============================================================
   AI FINANCIAL ASSISTANT  (grounded only in stored data)
   ============================================================ */
const Assistant={
  open:false,
  init(){
    this.suggest();
    this.push('bot', "I answer only from your stored data, approved records, the selected scenario, and your documented assumptions. I show my calculations, separate <span class='tag v'>verified</span> values from <span class='tag e'>estimates</span>, and I will ask for anything missing rather than invent it.");
  },
  toggle(){ this.open=!this.open; document.getElementById('assistant').classList.toggle('open',this.open); document.getElementById('fab').style.display=this.open?'none':'flex'; if(this.open) document.getElementById('asstInput').focus(); },
  suggest(){
    const qs=['What is my free cash flow?','Can I afford a home?','How am I tracking to my goals?','What is my highest-impact move?','What is my emergency fund status?'];
    document.getElementById('asstSuggest').innerHTML=qs.map(q=>`<button onclick="Assistant.ask('${q.replace(/'/g,"\\'")}')">${q}</button>`).join('');
  },
  push(who,html){ const b=document.getElementById('asstBody'); const d=document.createElement('div'); d.className='msg '+who; d.innerHTML=html; b.appendChild(d); b.scrollTop=b.scrollHeight; },
  send(){ const i=document.getElementById('asstInput'); const q=i.value.trim(); if(!q)return; i.value=''; this.ask(q); },
  ask(q){ this.push('user', q.replace(/</g,'&lt;')); const ans=this.answer(q); setTimeout(()=>this.push('bot',ans),140); Store.log('assistant','Q: '+q); },
  answer(q){
    const db=Store.db; const s=q.toLowerCase();
    const V="<span class='tag v'>verified</span>", E="<span class='tag e'>estimate</span>";
    const calc=(t)=>`<div class='calc'>${t}</div>`;
    // free cash flow / surplus
    if(/(cash flow|surplus|free cash|left over|leftover)/.test(s)){
      const ni=Calc.netIncome(db),ex=Calc.totalExpenses(db),d=Calc.debtPayments(db),sv=Calc.plannedSavings(db),fcf=Calc.monthlySurplus(db);
      return `${V} Your monthly free cash flow is <b>${fmtMoney(fcf)}</b>.`+calc(`monthly_surplus = net_income - expenses - debt - savings\n= ${fmtMoney(ni)} - ${fmtMoney(ex)} - ${fmtMoney(d)} - ${fmtMoney(sv)}\n= ${fmtMoney(fcf)}`)+(fcf<0?'This is a deficit \u2014 reducing variable spending is the fastest lever.':'This surplus is available for goals or debt.');
    }
    // afford home / mortgage
    if(/(afford|mortgage|house|home|buy)/.test(s)){
      const m=Calc.mortgage(db); const ready=m.back<=36&&m.front<=28&&m.reserves_after>=m.emergency_required;
      return `${E} Planning estimate only \u2014 not a lender decision. At a ${fmtMoney(m.price)} home price your housing payment is about <b>${fmtMoney(m.housing_payment)}</b>.`+
        calc(`front_end_DTI = housing / gross = ${fmtMoney(m.housing_payment)} / ${fmtMoney(m.gross)} = ${fmtPct(m.front)}\nback_end_DTI = (housing + debt) / gross = (${fmtMoney(m.housing_payment)} + ${fmtMoney(m.existing_debt)}) / ${fmtMoney(m.gross)} = ${fmtPct(m.back)}\nreserves after closing = ${fmtMoney(m.reserves_after)} (need ${fmtMoney(m.emergency_required)})`)+
        (ready?'You meet conservative front/back-end and reserve thresholds.':'One or more thresholds are exceeded \u2014 see Mortgage Readiness for improvement levers.');
    }
    // goals
    if(/(goal|save|target|contribut)/.test(s)){
      const lines=db.goals.map(g=>{const gc=Calc.goalCompute(db,g);return `\u2022 ${g.name}: ${gc.progress.toFixed(0)}% funded, needs ${fmtMoney2(gc.required_monthly)}/mo (gap ${fmtMoney2(gc.gap)})`;}).join('<br>');
      return `${V+E} Goal tracking (targets verified, growth estimated):<br>${lines}`;
    }
    // emergency fund
    if(/(emergency|reserve|rainy)/.test(s)){
      const em=Calc.emergencyMonths(db);
      return `${V} You have <b>${em.toFixed(1)} months</b> of emergency coverage (target ${db.settings.assumptions.emergency_fund_target_months}).`+(em<3?' Below the 3-month floor \u2014 prioritize this.':em<6?' Building toward the 6-month target.':' Fully funded.');
    }
    // debt
    if(/(debt|owe|loan|credit card|dti|income ratio)/.test(s)){
      const td=Calc.totalDebt(db),dti=Calc.dti(db);
      const hi=Calc.byType(db,'debt').slice().sort((a,b)=>(b.apr||0)-(a.apr||0))[0];
      return `${V} Total debt is <b>${fmtMoney(td)}</b>; debt-to-income is <b>${fmtPct(dti)}</b>.`+calc(`DTI = debt_payments / net_income = ${fmtMoney(Calc.debtPayments(db))} / ${fmtMoney(Calc.netIncome(db))} = ${fmtPct(dti)}`)+(hi?`Highest-rate balance: ${hi.name} at ${hi.apr}% \u2014 target it first (avalanche).`:'');
    }
    // net worth
    if(/(net worth|networth|wealth)/.test(s)){
      const nw=Calc.netWorth(db);
      return `${V} Estimated net worth is <b>${fmtMoney(nw)}</b>.`+calc(`net_worth = assets - debt = ${fmtMoney(db.accounts.reduce((a,x)=>a+(+x.balance||0),0))} - ${fmtMoney(Calc.totalDebt(db))} = ${fmtMoney(nw)}`);
    }
    // highest impact
    if(/(impact|priorit|recommend|advice|should i|best move|focus)/.test(s)){
      return this.recommendation();
    }
    // variance
    if(/(variance|over budget|overspend|spend)/.test(s)){
      const top=Calc.topUnfavorable(db,App.varMonth,3);
      if(!top.length) return `${V} No unfavorable variances this month \u2014 spending is within budget.`;
      return `${V} Top overspend this month:<br>`+top.map(r=>`\u2022 ${r.category}: +${fmtMoney(r.variance_amount)} (${fmtPct(r.variance_percentage)})`).join('<br>');
    }
    // unknown / missing data
    return `I can only answer from your stored data, approved records, the selected scenario, and documented assumptions \u2014 and I won't guess. I can cover cash flow, budget variance, goals, debt, emergency fund, net worth, mortgage affordability, or your highest-impact move. Could you rephrase toward one of those, or tell me which value you'd like me to use if something's missing?`;
  },
  recommendation(){
    const db=Store.db; const cand=[];
    const fcf=Calc.monthlySurplus(db); const em=Calc.emergencyMonths(db); const dti=Calc.dti(db);
    const hi=Calc.byType(db,'debt').slice().sort((a,b)=>(b.apr||0)-(a.apr||0))[0];
    if(fcf<0) cand.push({score:100,text:`Close the monthly deficit of ${fmtMoney(-fcf)} first \u2014 trim the largest variable categories.`});
    if(em<3) cand.push({score:90,text:`Build emergency reserves to 3 months; you're at ${em.toFixed(1)}. This protects every other plan.`});
    if(hi&&hi.apr>=18) cand.push({score:85,text:`Attack the ${hi.name} at ${hi.apr}% APR \u2014 highest guaranteed return via avalanche.`});
    if(dti>25) cand.push({score:70,text:`Lower debt-to-income (now ${fmtPct(dti)}) before taking on a mortgage.`});
    if(!cand.length) cand.push({score:50,text:`Cash flow, reserves and debt look healthy \u2014 direct surplus (${fmtMoney(fcf)}) to your highest-priority goal.`});
    cand.sort((a,b)=>b.score-a.score); const top=cand[0];
    return `<span class='tag v'>verified</span> Highest-impact recommendation: <b>${top.text}</b><br><span class='mini'>Ranked from your current stored figures; this is planning guidance, not investment, tax or legal advice.</span>`;
  }
};

/* ---------- boot ---------- */
App.init();

</script>
<script>
/* ===== reco.js (inlined) ===== */
/* ============================================================
   RECOMMENDATION ENGINE  (extension module)
   Loaded after app.js + ui.js. Reuses Store, Calc, helpers.
   Adds: engine, Recommendation Center view, budget-run report,
   explainability, plan bundles, data-quality gate, history.
   Touches no existing view, formula, or privacy control.
   ============================================================ */
'use strict';

/* ---- lazy settings extensions (non-destructive) ---- */
(function initRecoSettings(){
  const a=Store.db.settings.assumptions;
  const def={
    reserve_target_months:4,          // user-configurable emergency target (NOT auto-6)
    min_cash_reserve:2000,            // protected liquid floor
    credit_apr_threshold:15,          // % APR above which acceleration is evaluated
    variable_income:false,            // triggers conservative assumptions
    tax_rate:null,                    // must be user-provided/approved; null => not assumed
    purchase_within_months:30         // mortgage timeline
  };
  let changed=false;
  for(const k in def){ if(a[k]===undefined){ a[k]=def[k]; changed=true; } }
  if(!Store.db.reco_runs) { Store.db.reco_runs=[]; changed=true; }
  if(!Store.db.reco_status) { Store.db.reco_status={}; changed=true; }   // {recoKey:{status,reason,at}}
  if(!Store.db.reco_plan) { Store.db.reco_plan='balanced'; changed=true; }
  if(changed) Store.save();
})();

/* ============================================================
   Classification helpers (traceable, keyword-based)
   ============================================================ */
const RecoData = {
  essentialKeywords:/rent|mortgage|utilit|insurance|grocer|transport|fuel|phone|internet|medical|health|child|day ?care/i,
  isEssentialCat(c){
    if(c.type==='fixed') return true;
    if(c.type==='variable') return this.essentialKeywords.test(c.name);
    return false;
  },
  essentialExpenses(db){ return db.budget.filter(c=>(c.type==='fixed'||c.type==='variable')&&this.isEssentialCat(c)).reduce((s,c)=>s+(+c.budgeted||0),0); },
  discretionaryExpenses(db){ return db.budget.filter(c=>(c.type==='variable')&&!this.isEssentialCat(c)).reduce((s,c)=>s+(+c.budgeted||0),0); },
  minDebtPayments(db){ return Calc.byType(db,'debt').reduce((s,c)=>s+(+c.minimum||+c.budgeted||0),0); },
  liquidEmergency(db){ return db.accounts.filter(a=>a.type==='savings'||a.type==='checking').reduce((s,a)=>s+(+a.balance||0),0); },
  reducibleCats(db){ // discretionary categories, largest first
    return db.budget.filter(c=>c.type==='variable'&&!this.isEssentialCat(c)).slice().sort((a,b)=>(+b.budgeted)-(+a.budgeted));
  }
};

/* ============================================================
   Data-quality gate
   ============================================================ */
const DataQuality = {
  score(db){
    // completeness: required fields present across income, budget, mortgage, goals, accounts
    let filled=0, total=0;
    const need=(v)=>{ total++; if(v!==undefined&&v!==null&&v!==''&&!(typeof v==='number'&&isNaN(v))) filled++; };
    db.income.forEach(i=>{ need(i.amount); need(i.gross); });
    db.budget.forEach(c=>{ need(c.budgeted); if(c.type==='debt'){ need(c.apr); need(c.balance); need(c.minimum); } });
    ['gross_monthly','net_monthly','existing_debt','rate','home_price','down_payment'].forEach(k=>need(db.mortgage[k]));
    db.goals.forEach(g=>{ need(g.target); need(g.current); need(g.target_date); });
    const completeness = total? filled/total*100 : 0;

    // verification: share of records marked verified
    const recs=[].concat(db.income,db.budget,db.goals,db.accounts,db.documents,db.reconcile);
    const verified=recs.filter(r=>r.verification_status==='verified').length;
    const verification = recs.length? verified/recs.length*100 : 0;

    // recency: newest updated_at across records vs 45-day window
    const times=recs.map(r=>+new Date(r.updated_at||r.created_at||0)).filter(Boolean);
    const newest=times.length?Math.max(...times):0;
    const days=(Date.now()-newest)/86400000;
    const recency = Math.max(0, Math.min(100, 100 - (days/45*100)));

    // reconciliation: share of queue resolved (approved/rejected/corrected)
    const q=db.reconcile; const resolved=q.filter(r=>r.decision!=='pending').length;
    const reconciliation = q.length? resolved/q.length*100 : 100;

    const dq = completeness*0.35 + verification*0.30 + recency*0.20 + reconciliation*0.15;
    return {score:dq, completeness, verification, recency, reconciliation,
      band: dq>=90?'High confidence':dq>=75?'Reliable with minor gaps':dq>=60?'Provisional':'Insufficient for major decisions',
      sufficientForMajor: dq>=60,
      gaps: this.gaps(db,{completeness,verification,recency,reconciliation})};
  },
  gaps(db,d){
    const g=[];
    if(d.verification<80) g.push('Approve pending records in the Verification queue to raise verification coverage.');
    if(d.reconciliation<100) g.push(db.reconcile.filter(r=>r.decision==='pending').length+' reconciliation item(s) still pending.');
    if(d.recency<70) g.push('Some records have not been updated recently — confirm balances are current.');
    const missDebt=Calc.byType(db,'debt').filter(c=>!c.apr||!c.minimum);
    if(missDebt.length) g.push('Missing APR/minimum on debt: '+missDebt.map(c=>c.name).join(', ')+'.');
    return g;
  }
};

/* ============================================================
   Scoring
   ============================================================ */
function score(impact,urgency,risk,feasibility,confidence){
  const s = impact*0.30 + urgency*0.25 + risk*0.20 + feasibility*0.15 + confidence*0.10;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function classify(sc){ return sc>=80?'Immediate priority':sc>=65?'High priority':sc>=45?'Moderate priority':'Monitor or optional'; }
function classBadge(sc){ return sc>=80?'red':sc>=65?'amber':sc>=45?'blue':'gray'; }

/* ============================================================
   Core engine — evaluate 10 areas, emit recommendation objects
   Each reco: {key, area, rankTier, action, why, current, proposed,
     monthly, annual, goalEffect, debtEffect, mortgageEffect, risk,
     dims:{impact,urgency,risk,feasibility,confidence}, score, calc[],
     dataUsed[], firstAction, reviewDate, provisional}
   ============================================================ */
const Reco = {
  build(db){
    const dq=DataQuality.score(db);
    const conf = Math.round(dq.score);              // confidence tied to data quality
    const provisional = conf<60;
    const ni=Calc.netIncome(db);
    const ess=RecoData.essentialExpenses(db);
    const disc=RecoData.discretionaryExpenses(db);
    const minDebt=RecoData.minDebtPayments(db);
    const savings=Calc.plannedSavings(db);
    const fcf = ni - ess - disc - minDebt - savings;                 // spec free_cash_flow
    const ecr = (ess+minDebt)? ni/(ess+minDebt) : 99;                // essential coverage ratio
    const liquid=RecoData.liquidEmergency(db);
    const em = ess? liquid/ess : 0;                                  // months on ESSENTIAL expenses
    const a=db.settings.assumptions;
    const list=[];
    const reviewDate = addMonths(1).slice(0,10);
    const src=(arr)=>arr;

    /* ---- 1 & 3. Cash-flow stability / negative cash flow ---- */
    if(fcf < 0){
      const shortfall=-fcf;
      const grossNeeded = a.tax_rate!=null ? shortfall/(1-a.tax_rate) : null;
      const cuts=RecoData.reducibleCats(db);
      const cutPlan=[]; let acc=0; for(const c of cuts){ if(acc>=shortfall)break; const take=Math.min(+c.budgeted*0.5, shortfall-acc); cutPlan.push({name:c.name,amt:take}); acc+=take; }
      list.push(this.mk({
        key:'cashflow-deficit', area:'Cash-flow stability', rankTier:3,
        action:`Close the ${fmtMoney(shortfall)}/mo cash-flow deficit`,
        why:'Spending plus minimum obligations exceed net income; every month adds to fragility.',
        current:`Free cash flow ${fmtMoney(fcf)}/mo (negative).`,
        proposed:`Expense-only: cut ${fmtMoney(shortfall)}. Income-only: ${grossNeeded!=null?('+'+fmtMoney(grossNeeded)+' gross'):'gross figure needs an approved tax rate'}. Blended: split across both.`,
        monthly:shortfall, annual:shortfall*12,
        goalEffect:'Deficit currently blocks all discretionary goal funding.',
        debtEffect:'Prevents building beyond minimum payments.',
        mortgageEffect:'A negative cash flow disqualifies sustainable affordability regardless of DTI.',
        risk:'Expense cuts affect lifestyle; income changes take time to realize.',
        dims:{impact:95,urgency:98,risk:90,feasibility:cuts.length?70:45,confidence:conf},
        calc:[
          `free_cash_flow = net_income − essential − discretionary − min_debt − savings`,
          `= ${fmtMoney(ni)} − ${fmtMoney(ess)} − ${fmtMoney(disc)} − ${fmtMoney(minDebt)} − ${fmtMoney(savings)} = ${fmtMoney(fcf)}`,
          grossNeeded!=null? `income_needed = shortfall / (1 − tax_rate) = ${fmtMoney(shortfall)} / (1 − ${a.tax_rate}) = ${fmtMoney(grossNeeded)}` : `income route: no tax rate approved — gross requirement withheld (Rule: do not assume a tax rate).`,
          cutPlan.length? `expense route (top discretionary): ${cutPlan.map(x=>x.name+' −'+fmtMoney(x.amt)).join(', ')}` : ''
        ].filter(Boolean),
        dataUsed:['Income','Budget categories','Debt minimums'],
        firstAction: cutPlan.length? `Reduce ${cutPlan[0].name} by ${fmtMoney(cutPlan[0].amt)} this week.` : 'Identify one discretionary category to cut.',
        reviewDate, provisional
      }));
    } else if(ni>0 && fcf/ni < 0.05){
      list.push(this.mk({
        key:'cashflow-thin', area:'Cash-flow stability', rankTier:4,
        action:`Widen the thin ${fmtPct(fcf/ni*100)} cash-flow margin`,
        why:'A margin under 5% leaves no buffer for variance or surprises.',
        current:`Free cash flow ${fmtMoney(fcf)}/mo = ${fmtPct(fcf/ni*100)} of net income.`,
        proposed:`Target a 10% margin (${fmtMoney(ni*0.10)}/mo) by trimming discretionary spend ${fmtMoney(Math.max(0,ni*0.10-fcf))}.`,
        monthly:Math.max(0,ni*0.10-fcf), annual:Math.max(0,ni*0.10-fcf)*12,
        goalEffect:'Frees room to fund goals steadily.', debtEffect:'Creates capacity above minimums.',
        mortgageEffect:'Improves sustainable affordability buffer.',
        risk:'Requires trimming discretionary categories.',
        dims:{impact:60,urgency:55,risk:55,feasibility:75,confidence:conf},
        calc:[`margin = free_cash_flow / net_income = ${fmtMoney(fcf)} / ${fmtMoney(ni)} = ${fmtPct(fcf/ni*100)}`],
        dataUsed:['Income','Budget categories'], firstAction:'Pick one discretionary line to reduce 10%.', reviewDate, provisional
      }));
    }

    /* ---- 2. Essential coverage (protect essentials) ---- */
    if(ecr < 1.0){
      list.push(this.mk({
        key:'essential-coverage', area:'Essential coverage', rankTier:2,
        action:'Restore essential-expense coverage above 1.0',
        why:'Net income does not fully cover essentials plus minimum debt — the most urgent structural risk.',
        current:`essential_coverage_ratio = ${ecr.toFixed(2)} (below 1.0).`,
        proposed:`Increase income or cut essentials/min-debt so coverage ≥ 1.0. Gap ≈ ${fmtMoney((ess+minDebt)-ni)}/mo.`,
        monthly:Math.max(0,(ess+minDebt)-ni), annual:Math.max(0,(ess+minDebt)-ni)*12,
        goalEffect:'All goal funding suspended until covered.', debtEffect:'Risk of missed minimums.',
        mortgageEffect:'Home purchase not sustainable at this coverage.',
        risk:'May require renegotiating fixed costs or debt terms.',
        dims:{impact:98,urgency:99,risk:95,feasibility:55,confidence:conf},
        calc:[`essential_coverage_ratio = net_income / (essential + min_debt) = ${fmtMoney(ni)} / (${fmtMoney(ess)} + ${fmtMoney(minDebt)}) = ${ecr.toFixed(2)}`],
        dataUsed:['Income','Fixed & essential categories','Debt minimums'],
        firstAction:'Contact lenders about hardship/minimum options; list negotiable fixed costs.', reviewDate, provisional
      }));
    }

    /* ---- 5 (rank), Emergency reserves ---- */
    const targetM=a.reserve_target_months;
    const targetFund=ess*targetM;
    const gap=targetFund-liquid;
    const band = em<1?'Critical':em<3?'Vulnerable':em<6?'Stable':'Strong';
    if(gap>0 && fcf>=0){
      const reqContribution=gap/targetM;
      list.push(this.mk({
        key:'emergency-fund', area:'Emergency reserves', rankTier:4,
        action:`Build emergency reserves toward ${targetM} months`,
        why:`Reserves are ${em.toFixed(1)} months of essentials (${band}); the configured target is ${targetM}.`,
        current:`Liquid reserves ${fmtMoney(liquid)} = ${em.toFixed(1)} months.`,
        proposed:`Contribute ${fmtMoney(reqContribution)}/mo to close the ${fmtMoney(gap)} gap over ${targetM} months.`,
        monthly:reqContribution, annual:reqContribution*12,
        goalEffect:'Competes with discretionary goals until minimum band reached.',
        debtEffect:'Protects against debt-financed emergencies.',
        mortgageEffect:'Higher reserves strengthen post-closing safety.',
        risk:`Directing ${fmtMoney(reqContribution)}/mo here slows other goals.`,
        dims:{impact:70,urgency:em<1?92:em<3?75:45,risk:80,feasibility:fcf>=reqContribution?80:40,confidence:conf},
        calc:[
          `target_emergency_fund = essential × target_months = ${fmtMoney(ess)} × ${targetM} = ${fmtMoney(targetFund)}`,
          `emergency_fund_gap = target − current = ${fmtMoney(targetFund)} − ${fmtMoney(liquid)} = ${fmtMoney(gap)}`,
          `required_monthly = gap / target_months = ${fmtMoney(gap)} / ${targetM} = ${fmtMoney(reqContribution)}`
        ],
        dataUsed:['Savings/checking balances','Essential expenses','Reserve target (Settings)'],
        firstAction:`Automate ${fmtMoney(reqContribution)} to the emergency account on payday.`, reviewDate, provisional
      }));
    }

    /* ---- 5. High-interest debt (protect reserve first) ---- */
    const debts=Calc.byType(db,'debt').slice();
    const hi=debts.filter(c=>(+c.apr||0)>=a.credit_apr_threshold).sort((x,y)=>(+y.apr)-(+x.apr))[0];
    const reserveProtected = liquid>=a.min_cash_reserve && em>=1;
    if(hi){
      const extra = fcf>0? Math.min(fcf, Math.max(50, fcf*0.5)) : 0;
      const payoff=this.payoff(+hi.balance,+hi.apr, (+hi.minimum||+hi.budgeted)+extra);
      const base=this.payoff(+hi.balance,+hi.apr,(+hi.minimum||+hi.budgeted));
      const saved=base.interest-payoff.interest;
      list.push(this.mk({
        key:'debt-highapr-'+hi.id, area:'High-interest debt', rankTier: reserveProtected?5:9,
        action:`Accelerate payoff of ${hi.name} (${(+hi.apr).toFixed(1)}% APR)`,
        why:`Highest-cost balance; paying it early is a guaranteed ${(+hi.apr).toFixed(1)}% return.`,
        current:`Balance ${fmtMoney(hi.balance)}, min ${fmtMoney(hi.minimum||hi.budgeted)}/mo, payoff ${base.months} mo, interest ${fmtMoney(base.interest)}.`,
        proposed: reserveProtected? `Add ${fmtMoney(extra)}/mo → payoff ${payoff.months} mo, interest ${fmtMoney(payoff.interest)}.` : `Reserves below floor — pay minimum only until the ${fmtMoney(a.min_cash_reserve)} reserve is restored, then accelerate.`,
        monthly: reserveProtected? -extra : 0, annual: reserveProtected? saved : 0,
        goalEffect: reserveProtected? `Delays discretionary goals by the reallocated ${fmtMoney(extra)}/mo.` : 'No goal impact while paying minimum.',
        debtEffect:`Interest saved ≈ ${fmtMoney(saved)}; releases ${fmtMoney(hi.minimum||hi.budgeted)}/mo after payoff.`,
        mortgageEffect:`Removing this payment lowers back-end DTI.`,
        risk: reserveProtected? 'Ties up cash that could serve emergencies.' : 'Acceleration deferred to protect liquidity (Rule: preserve minimum reserve).',
        dims:{impact:82,urgency:(+hi.apr>=22?85:70),risk:75,feasibility:reserveProtected&&fcf>0?80:35,confidence:conf},
        calc:[
          `interest_saved = interest(min) − interest(min+extra)`,
          `= ${fmtMoney(base.interest)} − ${fmtMoney(payoff.interest)} = ${fmtMoney(saved)}`,
          `payoff_months(min+extra) via amortization at ${(+hi.apr).toFixed(1)}% = ${payoff.months} months`
        ],
        dataUsed:[`Debt: ${hi.name}`,'Free cash flow','Reserve floor (Settings)'],
        firstAction: reserveProtected? `Increase ${hi.name} autopay by ${fmtMoney(extra)}.` : 'Restore minimum reserve first.', reviewDate, provisional
      }));
    }

    /* ---- 4. Budget variance (behavioral vs structural) ---- */
    const months=Object.keys(db.actuals).sort();
    const overStreak=this.consecutiveOver(db);
    if(overStreak.count>=1){
      const cat=overStreak.cat;
      const kind = overStreak.count>=3? 'persistent (structural or unrealistic budget)' : 'recent';
      list.push(this.mk({
        key:'variance-'+ (cat?cat.id:'gen'), area:'Budget variance', rankTier:7,
        action: cat? `Resolve ${overStreak.count}-period overspend in ${cat.name}` : 'Resolve repeated budget overspend',
        why:`Actual exceeded budget for ${overStreak.count} period(s) — ${kind}.`,
        current: cat? `${cat.name}: budget ${fmtMoney(cat.budgeted)}, latest actual ${fmtMoney(overStreak.actual)} (+${fmtPct(overStreak.pct)}).` : 'Multiple categories over budget.',
        proposed: overStreak.count>=3? `Rebase the budget to ${fmtMoney(overStreak.actual)} if the spend is legitimate, or set a hard cap.` : `Cap next period at budget; review drivers.`,
        monthly: cat? Math.max(0,overStreak.actual-cat.budgeted):0, annual: cat? Math.max(0,overStreak.actual-cat.budgeted)*12:0,
        goalEffect:'Overspend diverts money from goals.', debtEffect:'Reduces payoff capacity.',
        mortgageEffect:'Distorts sustainable-affordability estimate.',
        risk:'Rebasing upward reduces surplus; a hard cap requires behavior change.',
        dims:{impact:55,urgency:overStreak.count>=3?70:45,risk:50,feasibility:70,confidence:conf},
        calc: cat?[`variance = actual − budget = ${fmtMoney(overStreak.actual)} − ${fmtMoney(cat.budgeted)} = ${fmtMoney(overStreak.actual-cat.budgeted)} (${fmtPct(overStreak.pct)})`]:[],
        dataUsed:['Budget vs actual history'], firstAction:'Classify the overspend: one-time, seasonal, structural, or behavioral.', reviewDate, provisional
      }));
    }

    /* ---- 7. Goal funding ---- */
    db.goals.forEach(g=>{
      const gc=Calc.goalCompute(db,g);
      const ratio = gc.required_monthly>0? gc.current_contribution/gc.required_monthly : 1;
      if(ratio<1 && fcf>=0){
        const cls = ratio>=0.8?'Slight adjustment required':ratio>=0.5?'At risk':'Off track';
        // 4 alternatives
        const need=g.target-g.current-gc.expected_growth;
        const altExtend=need/(gc.months+6);
        const altReduce=(gc.current_contribution*gc.months)+g.current+gc.expected_growth;
        list.push(this.mk({
          key:'goal-'+g.id, area:'Goal funding', rankTier:7,
          action:`Close the funding gap on “${g.name}”`,
          why:`Funding ratio ${(ratio*100).toFixed(0)}% (${cls}).`,
          current:`Contributing ${fmtMoney(gc.current_contribution)}/mo vs required ${fmtMoney(gc.required_monthly)}.`,
          proposed:`Four options below — none divert essentials, minimum debt, or protected reserves.`,
          monthly:gc.gap, annual:gc.gap*12,
          goalEffect:`On-time completion needs +${fmtMoney(gc.gap)}/mo.`,
          debtEffect:'Neutral.', mortgageEffect: /down/i.test(g.name)?'Directly affects down-payment readiness.':'Neutral.',
          risk:'Increasing contribution reduces other slack.',
          dims:{impact:50,urgency: this.monthsTo(g.target_date)<=12?70:45,risk:40,feasibility:fcf>=gc.gap?75:45,confidence:conf},
          calc:[
            `required_monthly = (target − current − expected_growth) / months`,
            `= (${fmtMoney(g.target)} − ${fmtMoney(g.current)} − ${fmtMoney(gc.expected_growth)}) / ${gc.months} = ${fmtMoney(gc.required_monthly)}`,
            `goal_funding_ratio = current_contribution / required = ${fmtMoney(gc.current_contribution)} / ${fmtMoney(gc.required_monthly)} = ${(ratio*100).toFixed(0)}%`,
            `Alt 1 increase: +${fmtMoney(gc.gap)}/mo`,
            `Alt 2 extend +6mo: required → ${fmtMoney(altExtend)}/mo`,
            `Alt 3 reduce target: reachable ≈ ${fmtMoney(altReduce)} at current pace`,
            `Alt 4 blended: e.g. +${fmtMoney(gc.gap/2)}/mo and +3mo deadline`
          ],
          dataUsed:[`Goal: ${g.name}`,'Contribution budget line'],
          firstAction:'Choose one of the four alternatives in the What-if panel.', reviewDate, provisional
        }));
      }
    });

    /* ---- 6. Mortgage readiness ---- */
    const m=Calc.mortgage(db);
    const backMax=a.back_end_max*100;
    if(m.back>backMax || m.reserves_after<m.emergency_required){
      const improvements=this.mortgageImprovements(db,m);
      const top=improvements[0];
      list.push(this.mk({
        key:'mortgage-readiness', area:'Mortgage readiness', rankTier:8,
        action:'Improve mortgage readiness before purchase',
        why: m.back>backMax? `Back-end DTI ${fmtPct(m.back)} exceeds the ${backMax}% guide.` : `Post-closing reserves ${fmtMoney(m.reserves_after)} fall short of the ${fmtMoney(m.emergency_required)} requirement.`,
        current:`Front-end ${fmtPct(m.front)}, back-end ${fmtPct(m.back)}, reserves after closing ${fmtMoney(m.reserves_after)}.`,
        proposed:`Highest-impact: ${top.text}`,
        monthly: top.monthly||0, annual:(top.monthly||0)*12,
        goalEffect:'May compete with the down-payment goal.', debtEffect: top.debtEffect||'Varies by action.',
        mortgageEffect: top.mortgageEffect,
        risk:'The largest qualification gain may deplete reserves — not automatically best.',
        dims:{impact:65,urgency: this.monthsTo(addMonths(a.purchase_within_months))<=12?75:45,risk:60,feasibility:60,confidence:conf},
        calc:[
          `back_end_DTI = (housing + existing_debt) / gross = (${fmtMoney(m.housing_payment)} + ${fmtMoney(m.existing_debt)}) / ${fmtMoney(m.gross)} = ${fmtPct(m.back)}`,
          `post_closing_reserves = liquid − down − closing = ${fmtMoney(m.reserves_after)}`
        ].concat(improvements.slice(0,5).map((x,i)=>`#${i+1} ${x.text}`)),
        dataUsed:['Mortgage inputs','Debts','Accounts'],
        firstAction: top.first||'Review the five ranked improvements in Mortgage Readiness.', reviewDate, provisional
      }));
    }

    /* ---- 8. Recurring expenses ---- */
    const recurTx=db.transactions.filter(t=>t.flags&&t.flags.includes('recurring'));
    if(recurTx.length){
      const monthlyRecur=recurTx.reduce((s,t)=>s+t.amount,0);
      list.push(this.mk({
        key:'recurring', area:'Recurring expenses', rankTier:10,
        action:'Audit recurring subscriptions',
        why:`${recurTx.length} recurring charge(s) detected totalling ${fmtMoney(monthlyRecur)}/mo.`,
        current:recurTx.map(t=>t.description+' '+fmtMoney(t.amount)).join(', ')+'.',
        proposed:`Cancel or downgrade unused services; even one at ${fmtMoney(monthlyRecur)}/mo = ${fmtMoney(monthlyRecur*12)}/yr.`,
        monthly:monthlyRecur, annual:monthlyRecur*12,
        goalEffect:'Recovered cash can fund goals.', debtEffect:'Or accelerate debt.', mortgageEffect:'Improves cash-flow buffer.',
        risk:'Loss of service utility.',
        dims:{impact:40,urgency:35,risk:30,feasibility:90,confidence:Math.min(conf,70)},
        calc:[`annualized = monthly_recurring × 12 = ${fmtMoney(monthlyRecur)} × 12 = ${fmtMoney(monthlyRecur*12)}`],
        dataUsed:['Flagged recurring transactions'], firstAction:'Review the recurring list and cancel one unused service.', reviewDate,
        provisional: provisional||true  // flagged tx are unverified estimates
      }));
    }

    /* ---- 10. Data quality ---- */
    if(!dq.sufficientForMajor){
      list.push(this.mk({
        key:'data-quality', area:'Financial-data quality', rankTier:1,
        action:'Verify source data before major decisions',
        why:`Data-quality score ${dq.score.toFixed(0)} is below 60 — insufficient for mortgage, consolidation, or long-term forecasts.`,
        current:`Completeness ${dq.completeness.toFixed(0)}, verification ${dq.verification.toFixed(0)}, recency ${dq.recency.toFixed(0)}, reconciliation ${dq.reconciliation.toFixed(0)}.`,
        proposed:'Resolve the listed gaps, then re-run the review.',
        monthly:0, annual:0, goalEffect:'—', debtEffect:'—', mortgageEffect:'Definitive mortgage advice withheld until ≥60.',
        risk:'Acting on low-quality data can mislead.',
        dims:{impact:60,urgency:80,risk:85,feasibility:85,confidence:100},
        calc:[`data_quality = completeness×0.35 + verification×0.30 + recency×0.20 + reconciliation×0.15 = ${dq.score.toFixed(0)}`].concat(dq.gaps.map(g=>'• '+g)),
        dataUsed:['All record metadata'], firstAction: dq.gaps[0]||'Approve pending records.', reviewDate, provisional:false
      }));
    }

    // Rank: primary tier first, then score desc; cap at 5 primary
    list.sort((x,y)=> (x.rankTier-y.rankTier) || (y.score-x.score));
    const primary=list.slice(0,5);
    return {generated_at:nowISO(), dq, metrics:{ni,ess,disc,minDebt,savings,fcf,ecr,liquid,em,band,targetM}, primary, all:list};
  },

  mk(o){
    o.score=score(o.dims.impact,o.dims.urgency,o.dims.risk,o.dims.feasibility,o.dims.confidence);
    o.class=classify(o.score);
    o.confidenceLabel = o.dims.confidence>=60? (o.dims.confidence>=80?'High':'Moderate') : 'Low';
    if(o.provisional || o.dims.confidence<60){ o.provisional=true; }
    return o;
  },

  /* amortization payoff: returns {months, interest} */
  payoff(balance, apr, payment){
    const r=apr/100/12; let bal=balance, interest=0, months=0;
    if(payment<=bal*r) return {months:Infinity, interest:Infinity}; // never pays off
    while(bal>0 && months<600){ const i=bal*r; interest+=i; bal=bal+i-payment; months++; }
    return {months, interest:Math.max(0,interest)};
  },
  monthsTo(iso){ return Calc.monthsBetween(nowISO(), iso); },

  consecutiveOver(db){
    const months=Object.keys(db.actuals).sort();
    let best={count:0,cat:null,actual:0,pct:0};
    Calc.byType(db,'variable').concat(Calc.byType(db,'fixed')).forEach(c=>{
      let streak=0, lastActual=0, lastPct=0;
      months.forEach(ym=>{ const act=+(db.actuals[ym]||{})[c.id]||0; if(act>c.budgeted){ streak++; lastActual=act; lastPct=(act-c.budgeted)/c.budgeted*100; } else streak=0; });
      if(streak>best.count) best={count:streak,cat:c,actual:lastActual,pct:lastPct};
    });
    return best;
  },

  mortgageImprovements(db,m){
    const out=[];
    // pay off a specific debt (largest payment)
    const debts=Calc.byType(db,'debt').slice().sort((a,b)=>(+b.budgeted)-(+a.budgeted));
    if(debts[0]){ const d=debts[0]; const newBack=(m.housing_payment + Math.max(0,m.existing_debt-(+d.budgeted)))/m.gross*100;
      out.push({text:`Pay off ${d.name}: releases ${fmtMoney(d.budgeted)}/mo, back-end ${fmtPct(m.back)} → ${fmtPct(newBack)} (consumes ${fmtMoney(d.balance)} cash).`, monthly:0, mortgageEffect:`Back-end → ${fmtPct(newBack)}`, debtEffect:`−${fmtMoney(d.balance)} balance`, first:`Model the ${d.name} payoff in Scenario Lab.`, gain:m.back-newBack}); }
    // increase down payment to 20%
    const need20=m.price*0.2; if(m.dp<need20){ const add=need20-m.dp; const r=Calc.mortgage(db,{down_payment:need20}); out.push({text:`Raise down payment to 20% (+${fmtMoney(add)}): removes PMI ${fmtMoney(m.pmi)}/mo, housing → ${fmtMoney(r.housing_payment)}.`, monthly:0, mortgageEffect:`Housing → ${fmtMoney(r.housing_payment)}`, first:'Increase down-payment fund contributions.', gain:(m.housing_payment-r.housing_payment)}); }
    // reduce home price 10%
    const r10=Calc.mortgage(db,{home_price:m.price*0.9}); out.push({text:`Reduce target price 10% (${fmtMoney(m.price*0.9)}): back-end → ${fmtPct(r10.back)}, housing → ${fmtMoney(r10.housing_payment)}.`, monthly:0, mortgageEffect:`Back-end → ${fmtPct(r10.back)}`, first:'Adjust target price in Mortgage Readiness.', gain:m.back-r10.back});
    // increase income
