<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Financial Decision Planner — Architecture</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:40px 20px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1500" style="max-width:1360px;width:100%">
  <defs>
    <marker id="aBlue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#58a6ff"/></marker>
    <marker id="aGreen" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#3fb950"/></marker>
    <marker id="aAmber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#d29922"/></marker>
    <marker id="aPurple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#bc8cff"/></marker>
    <marker id="aRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f85149"/></marker>
    <marker id="aGray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#484f58"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>

  <!-- TITLE -->
  <text x="680" y="46" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700">Financial Decision Planner</text>
  <text x="680" y="72" text-anchor="middle" fill="#8b949e" font-size="14">Private, browser-only planning system — how your data becomes a prioritized action plan</text>
  <rect x="510" y="86" width="340" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
  <circle cx="528" cy="99" r="4" fill="#3fb950"/>
  <text x="540" y="103" fill="#8b949e" font-size="11.5">No network calls — all data stays on this device</text>

  <!-- ============ ZONE 1: INPUTS ============ -->
  <text x="60" y="150" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1.5">ZONE 1 — WHERE INFORMATION COMES IN</text>
  <rect x="40" y="162" width="1280" height="128" rx="8" fill="#161b22" stroke="#30363d"/>

  <g filter="url(#shadow)">
    <rect x="70" y="188" width="290" height="80" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="86" y="214" fill="#e6edf3" font-size="14" font-weight="600">You enter your money</text>
    <text x="86" y="234" fill="#8b949e" font-size="11.5">Income, bills, debts, goals,</text>
    <text x="86" y="250" fill="#8b949e" font-size="11.5">and a home-purchase plan</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="390" y="188" width="290" height="80" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="406" y="214" fill="#e6edf3" font-size="14" font-weight="600">Sample data to start</text>
    <text x="406" y="234" fill="#8b949e" font-size="11.5">A realistic synthetic profile,</text>
    <text x="406" y="250" fill="#8b949e" font-size="11.5">clearly labelled as a demo</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="188" width="290" height="80" rx="6" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
    <text x="726" y="210" fill="#e6edf3" font-size="14" font-weight="600">Documents for review (sample)</text>
    <text x="726" y="230" fill="#8b949e" font-size="11.5">Synthetic extracts with confidence</text>
    <text x="726" y="246" fill="#8b949e" font-size="11.5">scores — wait for your approval,</text>
    <text x="726" y="262" fill="#8b949e" font-size="11.5">nothing is auto-trusted</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1030" y="188" width="262" height="80" rx="6" fill="#1c2128" stroke="#484f58" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1046" y="208" fill="#8b949e" font-size="14" font-weight="600">Auto document scan / OCR</text>
    <text x="1046" y="228" fill="#484f58" font-size="11.5">DISABLED — no OCR, no upload yet.</text>
    <text x="1046" y="244" fill="#484f58" font-size="11.5">Screenshots/photos cannot be read.</text>
    <text x="1046" y="260" fill="#484f58" font-size="11.5">External AWS integration required.</text>
  </g>

  <!-- ============ ZONE 2: STORAGE ============ -->
  <text x="60" y="330" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1.5">ZONE 2 — YOUR PRIVATE RECORD</text>
  <rect x="40" y="342" width="1280" height="112" rx="8" fill="#161b22" stroke="#30363d"/>
  <g filter="url(#shadow)">
    <rect x="70" y="366" width="590" height="66" rx="6" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
    <text x="86" y="392" fill="#e6edf3" font-size="14" font-weight="600">Private storage on this device</text>
    <text x="86" y="412" fill="#8b949e" font-size="11.5">Kept per person, never shared — every record stamped with when it was made,</text>
    <text x="86" y="426" fill="#8b949e" font-size="11.5">its source, and whether you have verified it</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="690" y="366" width="602" height="66" rx="6" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
    <text x="706" y="392" fill="#e6edf3" font-size="14" font-weight="600">Locked baseline + saved history</text>
    <text x="706" y="412" fill="#8b949e" font-size="11.5">An untouchable snapshot to compare against, plus a versioned record of every</text>
    <text x="706" y="426" fill="#8b949e" font-size="11.5">review you run and every recommendation decision</text>
  </g>

  <!-- ============ ZONE 3: CALCULATION ENGINE ============ -->
  <text x="60" y="494" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1.5">ZONE 3 — THE MATH ENGINE  (one trusted source for every number)</text>
  <rect x="40" y="506" width="1280" height="126" rx="8" fill="#161b22" stroke="#30363d"/>
  <g font-size="11.5">
    <g filter="url(#shadow)"><rect x="70" y="530" width="235" height="82" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="86" y="554" fill="#e6edf3" font-size="13" font-weight="600">Money left over</text>
      <text x="86" y="574" fill="#8b949e">Income minus bills, debt,</text>
      <text x="86" y="589" fill="#8b949e">and planned saving</text></g>
    <g filter="url(#shadow)"><rect x="320" y="530" width="235" height="82" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="336" y="554" fill="#e6edf3" font-size="13" font-weight="600">Safety cushion</text>
      <text x="336" y="574" fill="#8b949e">Months you could cover</text>
      <text x="336" y="589" fill="#8b949e">with no income</text></g>
    <g filter="url(#shadow)"><rect x="570" y="530" width="235" height="82" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="586" y="554" fill="#e6edf3" font-size="13" font-weight="600">Debt load</text>
      <text x="586" y="574" fill="#8b949e">Share of income going to</text>
      <text x="586" y="589" fill="#8b949e">debt, and payoff timelines</text></g>
    <g filter="url(#shadow)"><rect x="820" y="530" width="235" height="82" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="836" y="554" fill="#e6edf3" font-size="13" font-weight="600">Goal funding</text>
      <text x="836" y="574" fill="#8b949e">What each goal needs</text>
      <text x="836" y="589" fill="#8b949e">per month to arrive on time</text></g>
    <g filter="url(#shadow)"><rect x="1070" y="530" width="222" height="82" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="1086" y="554" fill="#e6edf3" font-size="13" font-weight="600">Home affordability</text>
      <text x="1086" y="574" fill="#8b949e">What a house would cost</text>
      <text x="1086" y="589" fill="#8b949e">and if it fits (estimate)</text></g>
  </g>

  <!-- ============ ZONE 4: RECOMMENDATION ENGINE ============ -->
  <text x="60" y="672" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1.5">ZONE 4 — THE RECOMMENDATION ENGINE  (runs on every financial review)</text>
  <rect x="40" y="684" width="1280" height="430" rx="8" fill="#161b22" stroke="#30363d"/>

  <!-- Step A: scan -->
  <g filter="url(#shadow)"><rect x="70" y="712" width="1222" height="72" rx="6" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/></g>
  <circle cx="98" cy="738" r="12" fill="#bc8cff" fill-opacity="0.15" stroke="#bc8cff"/><text x="98" y="742" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="700">A</text>
  <text x="122" y="736" fill="#e6edf3" font-size="14" font-weight="600">Scan ten areas of your finances</text>
  <text x="122" y="756" fill="#8b949e" font-size="11.5">Cash flow · reserves · high-cost debt · budget overspend · goals · home readiness · income stability · subscriptions · saving capacity · data quality</text>
  <text x="122" y="773" fill="#8b949e" font-size="11.5">Each area that has a problem becomes a candidate action</text>

  <!-- Step B: score -->
  <g filter="url(#shadow)"><rect x="70" y="800" width="600" height="128" rx="6" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/></g>
  <circle cx="98" cy="826" r="12" fill="#bc8cff" fill-opacity="0.15" stroke="#bc8cff"/><text x="98" y="830" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="700">B</text>
  <text x="122" y="824" fill="#e6edf3" font-size="14" font-weight="600">Score and rank each action</text>
  <text x="122" y="845" fill="#8b949e" font-size="11.5">Weighs how much it helps, how urgent it is, how much</text>
  <text x="122" y="861" fill="#8b949e" font-size="11.5">risk it removes, how doable it is, and how trustworthy</text>
  <text x="122" y="877" fill="#8b949e" font-size="11.5">the data is — into a single 0–100 priority score</text>
  <text x="122" y="900" fill="#484f58" font-size="11">Safety rule: no optional investing or extra payments while</text>
  <text x="122" y="914" fill="#484f58" font-size="11">essentials and minimum debts are not reliably covered</text>

  <!-- Step C: enhancement layer (highlight/gold) -->
  <g filter="url(#shadow)"><rect x="692" y="800" width="600" height="128" rx="6" fill="#1c2128" stroke="#e3b341" stroke-width="1.5"/></g>
  <circle cx="720" cy="826" r="12" fill="#e3b341" fill-opacity="0.15" stroke="#e3b341"/><text x="720" y="830" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="700">C</text>
  <text x="744" y="824" fill="#e6edf3" font-size="14" font-weight="600">Make each action human</text>
  <text x="744" y="845" fill="#8b949e" font-size="11.5">The differentiator layer that translates a scored item into</text>
  <text x="744" y="861" fill="#8b949e" font-size="11.5">something a person can act on:</text>
  <text x="744" y="884" fill="#e3b341" font-size="11.5">• One number to move  • Easy / Moderate / Hard effort</text>
  <text x="744" y="900" fill="#e3b341" font-size="11.5">• Dollar cost of doing nothing  • A milestone to reach</text>
  <text x="744" y="916" fill="#484f58" font-size="11">Turns "back-end DTI 41%" into "move $150, save $71 this month"</text>

  <!-- Step D: plans + gate -->
  <g filter="url(#shadow)"><rect x="70" y="944" width="600" height="150" rx="6" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/></g>
  <circle cx="98" cy="970" r="12" fill="#bc8cff" fill-opacity="0.15" stroke="#bc8cff"/><text x="98" y="974" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="700">D</text>
  <text x="122" y="968" fill="#e6edf3" font-size="14" font-weight="600">Build three whole-plan options</text>
  <text x="122" y="990" fill="#8b949e" font-size="11.5">Stability, Balanced, and Accelerated — each showing the</text>
  <text x="122" y="1006" fill="#8b949e" font-size="11.5">monthly split, 12-month outcome, risks, and effort needed</text>
  <g><rect x="122" y="1024" width="150" height="26" rx="4" fill="#0d1117" stroke="#3fb950"/><text x="197" y="1041" text-anchor="middle" fill="#3fb950" font-size="11">Stability</text></g>
  <g><rect x="282" y="1024" width="150" height="26" rx="4" fill="#0d1117" stroke="#d29922"/><text x="357" y="1041" text-anchor="middle" fill="#d29922" font-size="11">Balanced</text></g>
  <g><rect x="442" y="1024" width="150" height="26" rx="4" fill="#0d1117" stroke="#f85149"/><text x="517" y="1041" text-anchor="middle" fill="#f85149" font-size="11">Accelerated</text></g>
  <text x="122" y="1074" fill="#484f58" font-size="11">The most aggressive plan is never labelled "best"</text>

  <!-- Data-quality gate (red, guarding) -->
  <g filter="url(#shadow)"><rect x="692" y="944" width="600" height="150" rx="6" fill="#1c2128" stroke="#f85149" stroke-width="1.5"/></g>
  <circle cx="720" cy="970" r="12" fill="#f85149" fill-opacity="0.15" stroke="#f85149"/><text x="720" y="974" text-anchor="middle" fill="#f85149" font-size="12" font-weight="700">!</text>
  <text x="744" y="968" fill="#e6edf3" font-size="14" font-weight="600">Data-quality gate</text>
  <text x="744" y="990" fill="#8b949e" font-size="11.5">Before any major advice, checks how complete, verified,</text>
  <text x="744" y="1006" fill="#8b949e" font-size="11.5">recent, and reconciled your data is</text>
  <text x="744" y="1032" fill="#f85149" font-size="11.5">If confidence is too low, big mortgage/debt calls are held</text>
  <text x="744" y="1048" fill="#f85149" font-size="11.5">back and the action is marked "Provisional — verify first"</text>
  <text x="744" y="1074" fill="#484f58" font-size="11">Tells you exactly which records to confirm</text>

  <!-- ============ ZONE 5: PRESENTATION (dual mode) ============ -->
  <text x="60" y="1152" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1.5">ZONE 5 — HOW YOU SEE IT  (one engine, two views)</text>
  <rect x="40" y="1164" width="1280" height="180" rx="8" fill="#161b22" stroke="#30363d"/>

  <!-- Simple -->
  <g filter="url(#shadow)"><rect x="70" y="1188" width="600" height="134" rx="6" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/></g>
  <text x="90" y="1214" fill="#3fb950" font-size="13" font-weight="700">SIMPLE MODE — for everyday use</text>
  <text x="90" y="1236" fill="#e6edf3" font-size="11.5">• One-line health verdict: "You are stable"</text>
  <text x="90" y="1254" fill="#e6edf3" font-size="11.5">• Money in / out / left as three bars</text>
  <text x="90" y="1272" fill="#e6edf3" font-size="11.5">• A single "Do this next" card + quick wins</text>
  <text x="90" y="1290" fill="#e6edf3" font-size="11.5">• "Walk me through my money" guided review</text>
  <text x="90" y="1310" fill="#484f58" font-size="11">Four screens · plain words · you set the green/amber/red cutoffs</text>

  <!-- Advanced -->
  <g filter="url(#shadow)"><rect x="692" y="1188" width="600" height="134" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/></g>
  <text x="712" y="1214" fill="#58a6ff" font-size="13" font-weight="700">ADVANCED MODE — full detail</text>
  <text x="712" y="1236" fill="#e6edf3" font-size="11.5">• All nine screens and every ratio</text>
  <text x="712" y="1254" fill="#e6edf3" font-size="11.5">• Full action cards with the calculation shown</text>
  <text x="712" y="1272" fill="#e6edf3" font-size="11.5">• Scenario Lab, reconciliation, document review</text>
  <text x="712" y="1290" fill="#e6edf3" font-size="11.5">• Budget-run report and recommendation history</text>
  <text x="712" y="1310" fill="#484f58" font-size="11">A toggle switches modes; the numbers never change</text>

  <!-- Grounded assistant note spanning -->
  <text x="680" y="1372" text-anchor="middle" fill="#8b949e" font-size="11.5">A built-in assistant answers questions using only your stored data — it shows its math and separates verified facts from estimates</text>

  <!-- ============ ZONE 6: SHARED FOUNDATION ============ -->
  <rect x="40" y="1392" width="1280" height="72" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="1416" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1.5">RUNS UNDERNEATH EVERYTHING</text>
  <g font-size="11.5" fill="#8b949e">
    <circle cx="70" cy="1440" r="4" fill="#3fb950"/><text x="82" y="1444">Privacy: nothing leaves the device or is published</text>
    <circle cx="430" cy="1440" r="4" fill="#bc8cff"/><text x="442" y="1444">Approval required before verified data changes</text>
    <circle cx="800" cy="1440" r="4" fill="#d29922"/><text x="812" y="1444">Audit trail of approvals, edits, and reviews</text>
    <circle cx="1120" cy="1440" r="4" fill="#f85149"/><text x="1132" y="1444">Estimates never sold as advice</text>
  </g>

  <!-- ===== CONNECTING ARROWS ===== -->
  <!-- Zone1 -> Zone2 -->
  <line x1="365" y1="290" x2="365" y2="362" stroke="#58a6ff" stroke-width="2" marker-end="url(#aBlue)"/>
  <line x1="855" y1="290" x2="855" y2="362" stroke="#d29922" stroke-width="2" marker-end="url(#aAmber)"/>
  <!-- Zone2 -> Zone3 -->
  <line x1="680" y1="454" x2="680" y2="502" stroke="#3fb950" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="694" y="484" fill="#8b949e" font-size="10">FEEDS</text>
  <!-- Zone3 -> Zone4 (A) -->
  <line x1="680" y1="632" x2="680" y2="708" stroke="#58a6ff" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="694" y="666" fill="#8b949e" font-size="10">MEASURED VALUES</text>
  <!-- A->B and A->C -->
  <line x1="370" y1="784" x2="370" y2="796" stroke="#bc8cff" stroke-width="2" marker-end="url(#aPurple)"/>
  <line x1="992" y1="784" x2="992" y2="796" stroke="#bc8cff" stroke-width="2" marker-end="url(#aPurple)"/>
  <!-- B->C (enhance) -->
  <line x1="670" y1="864" x2="688" y2="864" stroke="#e3b341" stroke-width="2" marker-end="url(#aAmber)"/>
  <!-- B->D and C->gate -->
  <line x1="370" y1="928" x2="370" y2="940" stroke="#bc8cff" stroke-width="2" marker-end="url(#aPurple)"/>
  <line x1="992" y1="928" x2="992" y2="940" stroke="#f85149" stroke-width="2" marker-end="url(#aRed)"/>
  <!-- Zone4 -> Zone5 -->
  <line x1="370" y1="1094" x2="370" y2="1184" stroke="#3fb950" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="384" y="1140" fill="#8b949e" font-size="10">PLAIN VIEW</text>
  <line x1="992" y1="1094" x2="992" y2="1184" stroke="#58a6ff" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="1006" y="1140" fill="#8b949e" font-size="10">FULL VIEW</text>

  <!-- FEEDBACK LOOP: user acts / edits -> back to storage -->
  <path d="M 1300 1255 L 1338 1255 L 1338 398 L 1296 398" fill="none" stroke="#484f58" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aGray)"/>
  <text x="1250" y="820" fill="#484f58" font-size="10" transform="rotate(90 1250 820)">YOU ACT / EDIT — RE-RUN THE REVIEW</text>

  <!-- VERSION STAMP -->
  <text x="1300" y="1490" text-anchor="end" fill="#484f58" font-size="11">Financial Decision Planner · Architecture Map v1.0 · September 2026</text>
</svg>
</body>
</html>
